<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8F171B">
<title>Yamie Stock Check</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--m:#8F171B;--m2:#6E1014;--m3:#F4E7E5;--iv:#FBF9F6;--cr:#F3EEE6;--ink:#1D1714;--mut:#776B63;--ln:#E6DED4;--ok:#1E7A46;--okb:#E3F3E9;--bad:#B3261E;--badb:#FBE6E4;--warn:#9A6200;--warnb:#FFF2D9;--pend:#8A8178;--pendb:#EFEBE6;--r:12px}
*{box-sizing:border-box}html,body{margin:0;background:var(--iv);color:var(--ink);font:15px/1.4 Jost,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;margin:0;font-weight:700;letter-spacing:.2px}
h1{font-size:26px}h2{font-size:22px}h3{font-size:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;background:var(--m);color:#fff;font-weight:600;min-height:44px}
.btn.sec{background:#fff;color:var(--m);border:1.5px solid var(--m)}
.btn.ghost{background:var(--cr);color:var(--ink)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}.wrap{flex-wrap:wrap}.grow{flex:1}.sp{justify-content:space-between}
.mut{color:var(--mut)}.sm{font-size:13px}.b{font-weight:600}.num{font-variant-numeric:tabular-nums}
.card{background:#fff;border:1px solid var(--ln);border-radius:var(--r);padding:14px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--cr);color:var(--ink);white-space:nowrap}
.chip.m{background:var(--m3);color:var(--m)}
.st{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.st.ok{background:var(--okb);color:var(--ok)}.st.var{background:var(--badb);color:var(--bad)}.st.stale{background:var(--warnb);color:var(--warn)}.st.pending{background:var(--pendb);color:var(--pend)}
input[type=text],input[type=number],input[type=search],input[type=tel],input[type=password],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:#fff;min-height:44px}
textarea{min-height:70px}
label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
/* layout */
#app{min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:var(--m);color:#fff;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.top .logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;line-height:1}
.top .logo small{display:block;font-family:Jost;font-size:11px;font-weight:400;opacity:.8;letter-spacing:1.5px;text-transform:uppercase}
.top .date{background:rgba(255,255,255,.14);border-radius:8px;padding:6px 10px;font-size:13px}
.bell{position:relative;width:40px;height:40px;border-radius:10px;color:#fff;display:grid;place-items:center}
.bell i{position:absolute;top:3px;right:3px;background:#FFD27A;color:var(--m2);font-style:normal;font-size:11px;font-weight:700;border-radius:99px;padding:0 5px;min-width:18px;text-align:center}
main{padding:14px;padding-bottom:96px;max-width:1300px;margin:0 auto}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;padding:8px 2px 9px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--m);font-weight:600}
.banner{background:var(--warnb);color:var(--warn);padding:10px 14px;border-radius:10px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media(min-width:900px){
  .nav{top:0;bottom:0;right:auto;width:200px;flex-direction:column;border-top:0;border-right:1px solid var(--ln);padding-top:76px;gap:2px}
  .nav button{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:12px 20px;justify-content:flex-start}
  .nav button.on{background:var(--m3)}
  main{margin-left:200px;padding:22px 28px 110px}
  .top{z-index:30}
}
/* home */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--ln);border-radius:var(--r);padding:12px 14px}
.kpi .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.secs{display:grid;gap:12px;margin-top:14px}
@media(min-width:700px){.secs{grid-template-columns:repeat(3,1fr)}}
.seccard{cursor:pointer;text-align:left;width:100%}
.bar{height:8px;border-radius:99px;background:var(--pendb);overflow:hidden;display:flex;margin:10px 0 8px}
.bar span{display:block;height:100%}
.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media(min-width:700px){.acts{grid-template-columns:repeat(4,1fr)}}
/* list */
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.filters button{padding:7px 12px;border-radius:99px;background:#fff;border:1px solid var(--ln);white-space:nowrap;font-size:14px}
.filters button.on{background:var(--m);border-color:var(--m);color:#fff}
.grp{margin:16px 0 8px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;font-weight:600;display:flex;justify-content:space-between}
.locs{display:grid;gap:8px}
@media(min-width:700px){.locs{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1150px){.locs{grid-template-columns:repeat(3,1fr)}}
.loc{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--ln);border-radius:var(--r);padding:10px;text-align:left;width:100%}
.loc.var{border-color:#E9B5B0}.loc.ok{border-color:#B8DDC6}
.th{width:56px;height:56px;border-radius:9px;background:var(--cr);flex:none;display:grid;place-items:center;overflow:hidden;color:var(--m)}
.th img{width:100%;height:100%;object-fit:cover}
.loc .nm{font-weight:600}.loc .meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.loc .q{text-align:right;flex:none}
.loc .q .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.sticky{position:fixed;left:0;right:0;bottom:62px;padding:10px 14px;background:linear-gradient(transparent,var(--iv) 30%);z-index:15}
@media(min-width:900px){.sticky{left:200px;bottom:0}}
/* tables */
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--ln);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:600;background:var(--cr)}
tr.tot td{font-weight:700;background:var(--m3)}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:var(--r);background:#fff}
td.pos{color:var(--ok);font-weight:600}td.neg{color:var(--bad);font-weight:600}
/* modal */
.ov{position:fixed;inset:0;background:rgba(29,23,20,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--iv);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:0 0 calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){.ov{align-items:center}.md{border-radius:18px;max-height:90vh}}
.mh{position:sticky;top:0;background:var(--iv);padding:14px 16px 10px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--ln);z-index:2}
.mb{padding:14px 16px}
.x{width:36px;height:36px;border-radius:10px;background:var(--cr);font-size:20px;flex:none}
.photos{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.photos .ph{position:relative;flex:none}
.photos img{height:120px;border-radius:10px;display:block;cursor:zoom-in}
.photos .lbl{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:1px 7px;border-radius:99px}
.photos .del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;width:24px;height:24px}
.addph{height:120px;width:110px;border:1.5px dashed var(--m);border-radius:10px;color:var(--m);display:grid;place-items:center;text-align:center;font-size:13px;flex:none}
.cnt{width:100%;border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;background:#fff}
.cnt .r{display:grid;grid-template-columns:1fr 60px 132px 54px;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--ln)}
.cnt .r:last-child{border-bottom:0}
.cnt .r.h{background:var(--cr);font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.step{display:flex;align-items:center;border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.step button{width:40px;height:42px;font-size:20px;background:var(--cr)}
.step input{border:0;border-radius:0;text-align:center;min-height:42px;padding:4px;width:52px;-moz-appearance:textfield}
.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.seg{display:flex;background:var(--cr);border-radius:10px;padding:3px}
.seg button{flex:1;padding:8px;border-radius:8px;font-weight:500}
.seg button.on{background:#fff;color:var(--m);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:70;display:grid;place-items:center}
.lb img{max-width:96vw;max-height:90vh}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:90;max-width:90vw;text-align:center}
.al{display:flex;gap:10px;padding:12px;border-bottom:1px solid var(--ln);background:#fff}
.al.new{background:#FFFBF0}
.al .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:700}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--m) 0%,var(--m2) 100%)}
.lbox{background:var(--iv);border-radius:20px;padding:24px;width:100%;max-width:400px;text-align:center}
.users{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.users button{padding:12px 4px;border-radius:12px;background:#fff;border:1px solid var(--ln)}
.users button.on{border-color:var(--m);background:var(--m3);color:var(--m);font-weight:600}
.users .av{width:40px;height:40px;border-radius:99px;background:var(--m);color:#fff;display:grid;place-items:center;margin:0 auto 4px;font-weight:600}
.dots{display:flex;gap:12px;justify-content:center;margin:14px 0}
.dots i{width:14px;height:14px;border-radius:99px;border:2px solid var(--m)}
.dots i.f{background:var(--m)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:56px;border-radius:12px;background:#fff;border:1px solid var(--ln);font-size:22px;font-weight:500}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);margin-bottom:14px;overflow-x:auto}
.tabs button{padding:10px 14px;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button.on{border-color:var(--m);color:var(--m);font-weight:600}
.list>*{border-bottom:1px solid var(--ln)}
.li{display:flex;gap:10px;align-items:center;padding:10px 12px;background:#fff}
.chk{display:flex;gap:8px;align-items:center;padding:6px 0}
.chk input{width:20px;height:20px;accent-color:var(--m)}
@media print{.nav,.top,.sticky,.noprint{display:none!important}main{margin:0;padding:0}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { SECTIONS, PERMS, ROLE_PERMS, REASONS, summarize, sumLines, r3, locStatus, istDate } from './core.mjs';

const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => (+n || 0).toLocaleString('en-IN');
const g3 = (n) => (+n || 0).toFixed(3);
const sgn = (n) => (n > 0 ? '+' : '') + fmt(n);
const tm = (t) => new Date(t).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
const dt = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const ago = (t) => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : new Date(t).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) + ' ' + tm(t); };
const STLBL = { pending: 'Not checked', ok: 'OK', var: 'Variance', stale: 'Recount' };
const ICON = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  counter: '<rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/>',
  tray: '<path d="M3 8h18l-2 10H5z"/><path d="M8 8V5h8v3"/>',
  box: '<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
  total: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  more: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  bell: '<path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/>',
  cam: '<path d="M4 7h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13" r="3.5"/>',
};
const svg = (k, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;

const S = { token: localStorage.ysc_token || '', me: null, D: null, view: 'home', date: null, filter: 'all', q: '', tab: 'users', modal: false, sumCache: null };
const can = (p) => S.me && (S.me.role === 'admin' || (S.me.perms || []).includes(p));
const isToday = () => S.D && S.D.date === S.D.today;
const editable = () => isToday() && S.D.day.status !== 'closed';

async function api(path, body) {
  const r = await fetch('/api/' + path, { method: body ? 'POST' : 'GET', headers: { 'content-type': 'application/json', ...(S.token ? { authorization: 'Bearer ' + S.token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({ error: 'Network error' }));
  if (r.status === 401 && path !== 'login') { logout(); throw new Error(j.error || 'Please log in'); }
  if (!r.ok) throw new Error(j.error || 'Error ' + r.status);
  return j;
}
function toast(msg, ms = 2600) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
const fail = (e) => toast('⚠ ' + e.message, 4000);
const img = (key) => `/api/img/${key}?t=${encodeURIComponent(S.token)}`;

// ---------------- login ----------------
let LG = { users: [], sel: null, pin: '' };
async function showLogin() {
  S.me = null; document.title = 'Yamie Stock Check';
  try { const j = await api('login-list'); LG.users = j.users; } catch (e) { LG.users = []; }
  LG.sel = localStorage.ysc_last && LG.users.find((u) => u.id === localStorage.ysc_last) ? localStorage.ysc_last : null; LG.pin = '';
  renderLogin();
}
function renderLogin() {
  $('#app').innerHTML = `<div class="login"><div class="lbox">
    <div style="color:var(--m)">${svg('box', 34)}</div>
    <h1 style="color:var(--m)">Yamie Stock Check</h1><div class="mut sm">Counter · Buffer tray · Box stock</div>
    <div class="users">${LG.users.map((u) => `<button data-u="${esc(u.id)}" class="${LG.sel === u.id ? 'on' : ''}"><div class="av">${esc(u.name[0] || '?')}</div><div class="sm">${esc(u.name)}</div><div class="mut" style="font-size:11px">${esc(u.role)}</div></button>`).join('') || '<div class="mut">Cannot reach server</div>'}</div>
    <div class="${LG.sel ? '' : 'hidden'}"><div class="mut sm">Enter PIN</div><div class="dots">${Array.from({ length: Math.max(4, LG.pin.length) }, (_, i) => `<i class="${i < LG.pin.length ? 'f' : ''}"></i>`).join('')}</div>
    <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '⌫', 0, '→'].map((k) => `<button data-k="${k}" ${k === '→' ? 'style="background:var(--m);color:#fff"' : ''}>${k}</button>`).join('')}</div></div>
  </div></div>`;
  $('#app').querySelectorAll('[data-u]').forEach((b) => b.onclick = () => { LG.sel = b.dataset.u; LG.pin = ''; renderLogin(); });
  $('#app').querySelectorAll('[data-k]').forEach((b) => b.onclick = () => padKey(b.dataset.k));
}
async function padKey(k) {
  if (k === '⌫') LG.pin = LG.pin.slice(0, -1);
  else if (k === '→') return doLogin();
  else if (LG.pin.length < 6) LG.pin += k;
  renderLogin();
}
async function doLogin() {
  if (LG.pin.length < 4) return toast('Enter your PIN');
  try {
    const j = await api('login', { userId: LG.sel, pin: LG.pin });
    S.token = j.token; localStorage.ysc_token = j.token; localStorage.ysc_last = LG.sel; S.me = j.user; S.view = 'home';
    await load();
  } catch (e) { LG.pin = ''; renderLogin(); fail(e); }
}
document.addEventListener('keydown', (e) => { if (S.me || !LG.sel) return; if (/^\d$/.test(e.key)) padKey(e.key); else if (e.key === 'Backspace') padKey('⌫'); else if (e.key === 'Enter') padKey('→'); });
function logout() { S.token = ''; localStorage.removeItem('ysc_token'); S.me = null; showLogin(); }

// ---------------- data ----------------
async function load(quiet) {
  try {
    const j = await api('state' + (S.date ? '?date=' + S.date : ''));
    const prevUnread = S.D?.alerts?.unread || 0;
    S.D = j; S.me = j.me; S.date = j.date === j.today ? null : j.date;
    S.sum = summarize(j.locs, j.day.opening, j.mvs, j.counts, j.settings);
    S.locById = Object.fromEntries(j.locs.map((l) => [l.id, l]));
    if (quiet && j.alerts.unread > prevUnread) notify(j.alerts.unread - prevUnread);
    if (!quiet || !S.modal) render();
    else renderTop();
  } catch (e) { if (S.token) fail(e); }
}
function notify(n) {
  if (localStorage.ysc_notify === '1' && 'Notification' in window && Notification.permission === 'granted') {
    try { new Notification('Yamie Stock Check', { body: `${n} new stock alert${n > 1 ? 's' : ''}`, icon: 'icon.svg' }); } catch {}
  } else toast(`🔔 ${n} new alert${n > 1 ? 's' : ''}`);
}
setInterval(() => { if (S.me && document.visibilityState === 'visible' && !S.modal) load(true); }, 40000);
document.addEventListener('visibilitychange', () => { if (S.me && document.visibilityState === 'visible' && !S.modal) load(true); });

const activeLocs = (sec) => S.D.locs.filter((l) => (l.active !== false || sumLines(S.sum.exp[l.id]?.lines)) && (!sec || l.sec === sec)).sort((a, b) => (a.order || 0) - (b.order || 0));
const expOf = (id) => S.sum.exp[id] || { lines: {}, wt: 0 };
const opOf = (id) => S.D.day.opening[id] || { lines: {}, wt: 0 };
const hideExp = () => S.D.settings.blind && !can('setup') && !can('move');
const secLabel = (k) => SECTIONS.find((s) => s.key === k)?.label || k;
const uname = (id) => S.D.userNames[id] || id;
const linesTxt = (l) => Object.entries(l || {}).filter(([, n]) => n).map(([t, n]) => `${t} ${fmt(n)}`).join(', ') || '—';
const diffTxt = (d) => Object.entries(d || {}).map(([t, n]) => `${t} ${sgn(n)}`).join(', ');

// ---------------- shell ----------------
const NAV = [['home', 'Home', 'home'], ['counter', 'Counter', 'counter'], ['tray', 'Trays', 'tray'], ['box', 'Boxes', 'box'], ['total', 'Consolidated', 'total'], ['more', 'More', 'more']];
function render() {
  if (!S.me) return showLogin();
  document.title = `Yamie Stock Check · ${S.D.date}`;

function bindVoid(root, after) {

async function shrink(file, max = 1280) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.78);
}

    const ts = [...new Set([...Object.keys(e.lines), ...Object.keys(o.lines), ...Object.keys(f.in), ...Object.keys(f.out), ...Object.keys(c?.lines || {})])].sort((a, b) => types.indexOf(a) - types.indexOf(b));
    if (!ts.length) ts.push('');
    ts.forEach((t, i) => { const cn = c && c.mode !== 'weight' ? (c.lines?.[t] || 0) : ''; rows.push([S.D.date, secLabel(l.sec), l.group, l.name, l.boxNo || '', l.purity, l.cat, t, o.lines[t] || 0, f.in[t] || 0, f.out[t] || 0, e.lines[t] || 0, cn, cn === '' ? '' : cn - (e.lines[t] || 0), i ? '' : (l.sec === 'box' ? e.wt : ''), i ? '' : (c?.wt ?? ''), STLBL[st.state], c ? uname(c.by) : '', c ? tm(c.at) : '']); });
  }
  const csv = rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = `yamie-stock-${S.D.date}.csv`; a.click();
}

// ---------------- more / alerts / log / history / admin ----------------
function vMore() {
  const items = [['log', 'Day log', 'Movements and checks today', true], ['alerts', 'Alerts', 'Variances and reports', can('alerts')], ['history', 'History', 'Past days and closing stock', can('reports')], ['admin', 'Admin', 'Users, locations, settings', can('users') || can('setup')]].filter((x) => x[3]);
  $('#main').innerHTML = `<h1 style="margin-bottom:12px">More</h1><div class="list card" style="padding:0">${items.map(([k, t, d]) => `<button class="li" style="width:100%;text-align:left" data-go="${k}"><div class="grow"><div class="b">${t}</div><div class="mut sm">${d}</div></div><span class="mut">›</span></button>`).join('')}
    <button class="li" style="width:100%;text-align:left" id="pinBtn"><div class="grow"><div class="b">Change my PIN</div><div class="mut sm">${esc(S.me.name)} · ${esc(S.me.role)}</div></div></button>
    <button class="li" style="width:100%;text-align:left" id="notiBtn"><div class="grow"><div class="b">Notifications on this device</div><div class="mut sm">${localStorage.ysc_notify === '1' ? 'On' : 'Off'} — alerts while the app is open</div></div></button>
    <button class="li" style="width:100%;text-align:left;color:var(--bad)" id="outBtn"><div class="grow b">Log out</div></button></div>`;
  $('#main').querySelectorAll('[data-go]').forEach((b) => b.onclick = () => go(b.dataset.go));
  $('#outBtn').onclick = logout;
  $('#notiBtn').onclick = async () => { if (localStorage.ysc_notify === '1') localStorage.ysc_notify = '0'; else { if ('Notification' in window) { const p = await Notification.requestPermission(); if (p !== 'granted') toast('Notifications blocked in browser settings — in-app alerts still work'); } localStorage.ysc_notify = '1'; } vMore(); };
  $('#pinBtn').onclick = () => modal('Change my PIN', '', `<label class="f">Current PIN</label><input type="password" inputmode="numeric" id="p0"><label class="f">New PIN (4–6 digits)</label><input type="password" inputmode="numeric" id="p1"><button class="btn" style="width:100%;margin-top:14px" id="pS">Save</button>`, () => { $('#pS').onclick = async () => { try { await api('me/pin', { old: $('#p0').value, pin: $('#p1').value }); toast('PIN changed'); closeModal(); } catch (e) { fail(e); } }; });
}
async function vAlerts() {
  $('#main').innerHTML = '<h1>Alerts</h1><div class="mut" style="margin-top:8px">Loading…</div>';
  try {
    const j = await api('alerts'); api('alerts/seen', {}).then(() => { S.D.alerts.unread = 0; renderTop(); });
    const I = { variance: ['!', 'var(--badb)', 'var(--bad)'], report: ['✓', 'var(--okb)', 'var(--ok)'], close: ['■', 'var(--m3)', 'var(--m)'], info: ['i', 'var(--warnb)', 'var(--warn)'] };
    $('#main').innerHTML = `<h1 style="margin-bottom:12px">Alerts</h1><div class="card" style="padding:0;overflow:hidden">${j.alerts.map((a) => { const k = I[a.type] || I.info; const ic = a.type === 'report' && !a.ok ? ['!', 'var(--warnb)', 'var(--warn)'] : k; return `<div class="al ${a.at > j.seen && a.by !== S.me.id ? 'new' : ''}"><div class="ic" style="background:${ic[1]};color:${ic[2]}">${ic[0]}</div><div class="grow"><div class="b">${esc(a.title)}</div><div class="sm">${esc(a.body)}</div><div class="mut sm">${esc(uname(a.by))} · ${ago(a.at)}</div></div>${a.locId && a.date === S.D.today && S.locById[a.locId] && isToday() ? `<button class="btn sm ghost" data-loc="${a.locId}">Open</button>` : ''}</div>`; }).join('') || '<div class="mut" style="padding:20px;text-align:center">No alerts in the last 7 days</div>'}</div>`;
    bindLocCards();
  } catch (e) { fail(e); }
}
function vLog() {
  const mvs = [...S.D.mvs].reverse(); const cs = [...S.D.counts].sort((a, b) => b.at - a.at);
  $('#main').innerHTML = `${viewBanner()}<h1 style="margin-bottom:12px">Day log · ${dt(S.D.date)}</h1>
  <div class="tabs"><button data-t="mv" class="${S.tab !== 'ct' ? 'on' : ''}">Stock movements (${mvs.length})</button><button data-t="ct" class="${S.tab === 'ct' ? 'on' : ''}">Checks (${cs.length})</button></div>
  ${S.tab !== 'ct' ? `<div class="card list" style="padding:0">${mvs.map((m) => mvLine(m)).join('') || '<div class="mut" style="padding:20px">No movements</div>'}</div>`
    : `<div class="tw"><table><tr><th>Location</th><th>By</th><th>Time</th><th>Counted</th><th>Weight</th><th>Result</th></tr>${cs.map((c) => `<tr><td><b>${esc(S.locById[c.locId]?.name || c.locId)}</b><div class="mut sm">${secLabel(c.sec)}</div></td><td>${esc(uname(c.by))}</td><td>${tm(c.at)}</td><td>${c.lines ? fmt(sumLines(c.lines)) : '—'}</td><td>${c.wt != null ? g3(c.wt) : '—'}</td><td style="text-align:left"><span class="st ${c.result}">${STLBL[c.result]}</span> <span class="sm">${esc(diffTxt(c.diff))}</span></td></tr>`).join('')}</table></div>`}`;
  bindBanner();
  $('#main').querySelectorAll('[data-t]').forEach((b) => b.onclick = () => { S.tab = b.dataset.t; vLog(); });
  bindVoid($('#main'));
}
async function vHistory() {
  $('#main').innerHTML = '<h1>History</h1><div class="mut">Loading…</div>';
  try {
    const j = await api('history');
    $('#main').innerHTML = `<h1 style="margin-bottom:12px">History</h1><div class="tw"><table><tr><th>Date</th><th>Status</th><th>Opening</th><th>In</th><th>Out</th><th>Closing</th>${SECTIONS.map((s) => `<th>${s.short}</th>`).join('')}<th>Checked</th><th>Variance</th><th></th></tr>
    ${j.days.map((d) => { const m = d.summary; return `<tr><td class="b">${dt(d.date)}</td><td style="text-align:left">${d.status === 'closed' ? `<span class="st ok">Closed</span>${d.autoClosed ? ' <span class="mut sm">auto</span>' : ''}` : '<span class="st stale">Open</span>'}</td>
      ${m ? `<td>${fmt(m.opening)}</td><td>${fmt(m.in)}</td><td>${fmt(m.out)}</td><td class="b">${fmt(m.closing)}</td>${SECTIONS.map((s) => `<td>${fmt(m.sec?.[s.key]?.closing || 0)}</td>`).join('')}<td>${m.checked}/${m.locs}</td><td class="${m.variances ? 'neg' : 'pos'}">${m.variances}</td>` : `<td colspan="${6 + SECTIONS.length}" class="mut" style="text-align:center">In progress</td>`}
      <td><button class="btn sm ghost" data-day="${d.date}">View</button></td></tr>`; }).join('')}</table></div>`;
    $('#main').querySelectorAll('[data-day]').forEach((b) => b.onclick = async () => { S.date = b.dataset.day === S.D.today ? null : b.dataset.day; S.view = 'total'; await load(); });
  } catch (e) { fail(e); }
}
async function vAdmin() {
  const tabs = [['users', 'Users', can('users')], ['locs', 'Locations', can('setup')], ['settings', 'Settings', can('setup')]].filter((x) => x[2]);
  if (!tabs.find((t) => t[0] === S.tab)) S.tab = tabs[0]?.[0];
  $('#main').innerHTML = `<h1 style="margin-bottom:12px">Admin</h1><div class="tabs">${tabs.map(([k, t]) => `<button data-t="${k}" class="${S.tab === k ? 'on' : ''}">${t}</button>`).join('')}</div><div id="adm"></div>`;
  $('#main').querySelectorAll('[data-t]').forEach((b) => b.onclick = () => { S.tab = b.dataset.t; vAdmin(); });
  if (S.tab === 'users') admUsers(); else if (S.tab === 'locs') admLocs(); else admSettings();
}
async function admUsers() {
  const j = await api('users');
  $('#adm').innerHTML = `<div class="row sp" style="margin-bottom:10px"><div class="mut">Staff log in with name + PIN</div><button class="btn sm" id="uAdd">＋ Add user</button></div>
    <div class="card list" style="padding:0">${j.users.map((u) => `<button class="li" style="width:100%;text-align:left;${u.active ? '' : 'opacity:.5'}" data-u="${u.id}"><div class="grow"><div class="b">${esc(u.name)} <span class="chip m">${esc(u.role)}</span>${u.active ? '' : ' <span class="chip">disabled</span>'}</div><div class="mut sm">${(u.role === 'admin' ? Object.keys(PERMS) : u.perms).map((p) => PERMS[p]).join(' · ')}</div></div><span class="mut">›</span></button>`).join('')}</div>`;
  const edit = (u) => modal(u.id ? 'Edit user' : 'Add user', '', `<label class="f">Name</label><input type="text" id="uN" value="${esc(u.name || '')}">
    <label class="f">Role</label><select id="uR">${Object.keys(ROLE_PERMS).map((r) => `<option ${u.role === r ? 'selected' : ''}>${r}</option>`).join('')}</select>
    <label class="f">Permissions</label><div id="uP">${Object.entries(PERMS).map(([k, t]) => `<label class="chk"><input type="checkbox" value="${k}" ${(u.perms || ROLE_PERMS[u.role || 'staff']).includes(k) ? 'checked' : ''}> ${t}</label>`).join('')}</div>
    <label class="f">${u.id ? 'New PIN (leave blank to keep)' : 'PIN (4–6 digits)'}</label><input type="password" inputmode="numeric" id="uPin">
    ${u.id ? `<label class="chk"><input type="checkbox" id="uA" ${u.active !== false ? 'checked' : ''}> Active</label>` : ''}
    <button class="btn" style="width:100%;margin-top:14px" id="uS">Save</button>`, (ov) => {
    $('#uR').onchange = () => { const p = ROLE_PERMS[$('#uR').value]; ov.querySelectorAll('#uP input').forEach((c) => c.checked = p.includes(c.value)); };
    $('#uS').onclick = async () => { try { await api('users/save', { user: { id: u.id, name: $('#uN').value.trim(), role: $('#uR').value, perms: [...ov.querySelectorAll('#uP input:checked')].map((c) => c.value), active: $('#uA') ? $('#uA').checked : true }, pin: $('#uPin').value }); toast('Saved'); closeModal(); admUsers(); load(true); } catch (e) { fail(e); } };
  });
  $('#uAdd').onclick = () => edit({ role: 'staff' });
  $('#adm').querySelectorAll('[data-u]').forEach((b) => b.onclick = () => edit(j.users.find((u) => u.id === b.dataset.u)));
}
function admLocs() {
  $('#adm').innerHTML = `<div class="mut sm" style="margin-bottom:10px">Tap a location to set its purity, category, item type, photos and stock. ${editable() ? '' : '<b>Day is closed — reopen to change stock.</b>'}</div>` + SECTIONS.map((s) => `<div class="grp"><span>${s.label} (${activeLocs(s.key).length})</span>${editable() ? `<button class="btn sm sec" data-add="${s.key}">＋ Add</button>` : ''}</div>
    <div class="tw"><table><tr><th>Name</th><th>Group</th><th>Purity</th><th>Category</th><th>Item</th><th>Photos</th><th>Pcs</th>${s.key === 'box' ? '<th>Weight g</th>' : ''}</tr>${activeLocs(s.key).map((l) => `<tr data-loc="${l.id}" style="cursor:pointer"><td class="b">${esc(l.name)}${l.boxNo ? ` <span class="chip m">${esc(l.boxNo)}</span>` : ''}</td><td style="text-align:left">${esc(l.group)}</td><td style="text-align:left">${esc(l.purity || '—')}</td><td style="text-align:left">${esc(l.cat || '—')}</td><td style="text-align:left">${esc(l.itemType || 'Mixed')}</td><td>${(l.images || []).length || '—'}</td><td>${fmt(sumLines(expOf(l.id).lines))}</td>${s.key === 'box' ? `<td class="${expOf(l.id).wt ? '' : 'neg'}">${expOf(l.id).wt ? g3(expOf(l.id).wt) : 'not set'}</td>` : ''}</tr>`).join('')}</table></div>`).join('');
  $('#adm').querySelectorAll('[data-loc]').forEach((r) => r.onclick = () => locSheet(r.dataset.loc));
  $('#adm').querySelectorAll('[data-add]').forEach((b) => b.onclick = () => locEdit({ sec: b.dataset.add, group: '', name: '', cat: 'Gold', images: [], mode: 'both' }));
}
function admSettings() {
  const st = S.D.settings;
  $('#adm').innerHTML = `<div class="card">
    <label class="f">Shop name</label><input type="text" id="sN" value="${esc(st.shopName)}">
    <label class="f">Admin WhatsApp number for reports (with country code, e.g. 9187141 22750)</label><input type="tel" id="sW" value="${esc(st.waNumber)}" placeholder="91XXXXXXXXXX">
    <label class="f">Box weight tolerance (± grams)</label><input type="number" step="0.001" id="sT" value="${st.wtTol}">
    <label class="chk" style="margin-top:10px"><input type="checkbox" id="sB" ${st.blind ? 'checked' : ''}> Blind count — staff don't see expected numbers while counting</label>
    <label class="f">Item types (comma separated)</label><textarea id="sI">${esc(st.itemTypes.join(', '))}</textarea>
    <label class="f">Purities</label><input type="text" id="sP" value="${esc(st.purities.join(', '))}">
    <label class="f">Categories</label><input type="text" id="sC" value="${esc(st.categories.join(', '))}">
    <button class="btn" style="width:100%;margin-top:14px" id="sS">Save settings</button></div>`;
  const list = (v) => v.split(',').map((x) => x.trim()).filter(Boolean);
  $('#sS').onclick = async () => { try { await api('settings', { settings: { shopName: $('#sN').value, waNumber: $('#sW').value, wtTol: +$('#sT').value, blind: $('#sB').checked, itemTypes: list($('#sI').value), purities: list($('#sP').value), categories: list($('#sC').value) } }); toast('Settings saved'); load(true); } catch (e) { fail(e); } };
}

// ---------------- boot ----------------
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (S.token) load().then(() => { if (!S.D) showLogin(); }); else showLogin();
</script>
</body>
</html>
