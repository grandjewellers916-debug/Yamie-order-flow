<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8F171B">
<title>Yamie Core</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--m:#8F171B;--m2:#6E1014;--m3:#F4E7E5;--iv:#FBF9F6;--cr:#F3EEE6;--ink:#1D1714;--mut:#776B63;--ln:#E6DED4;--ok:#1E7A46;--okb:#E3F3E9;--bad:#B3261E;--badb:#FBE6E4;--warn:#9A6200;--warnb:#FFF2D9;--pend:#8A8178;--pendb:#EFEBE6;--r:12px}
*{box-sizing:border-box}html,body{margin:0;background:var(--iv);color:var(--ink);font:15px/1.4 Jost,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;margin:0;font-weight:700;letter-spacing:.2px}
h1{font-size:26px}h2{font-size:22px}h3{font-size:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;background:var(--m);color:#fff;font-weight:600;min-height:44px}
.btn.sec{background:#fff;color:var(--m);border:1.5px solid var(--m)}
.btn.ghost{background:var(--cr);color:var(--ink)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}.wrap{flex-wrap:wrap}.grow{flex:1}.sp{justify-content:space-between}
.mut{color:var(--mut)}.sm{font-size:13px}.b{font-weight:600}.num{font-variant-numeric:tabular-nums}
.card{background:#fff;border:1px solid var(--ln);border-radius:var(--r);padding:14px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--cr);color:var(--ink);white-space:nowrap}
.chip.m{background:var(--m3);color:var(--m)}
.st{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.st.ok{background:var(--okb);color:var(--ok)}.st.var{background:var(--badb);color:var(--bad)}.st.stale{background:var(--warnb);color:var(--warn)}.st.pending{background:var(--pendb);color:var(--pend)}
input:not([type]),input[type=date],input[type=text],input[type=number],input[type=search],input[type=tel],input[type=password],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:#fff;min-height:44px}
textarea{min-height:70px}
label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
/* layout */
#app{min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:var(--m);color:#fff;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.top .logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;line-height:1}
.top .logo small{display:block;font-family:Jost;font-size:11px;font-weight:400;opacity:.8;letter-spacing:1.5px;text-transform:uppercase}
.vtag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:99px;background:rgba(255,255,255,.18);letter-spacing:.3px;text-transform:none;font-weight:500;opacity:1}
.dcw{position:relative}.dcw .dcard{padding-right:70px}.dqv{position:absolute;right:8px;bottom:8px;border:1px solid var(--ln);background:#fff;border-radius:99px;padding:5px 10px;font-size:12px;color:var(--m);font-weight:600}
.dv{position:fixed;inset:0;z-index:90;background:#111;color:#fff;display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none}
.dvbar{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;background:rgba(0,0,0,.6);z-index:2}.dvt{flex:1;min-width:0}.dvt .b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dvt .sm{opacity:.7}
.dvb{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;min-width:40px;height:40px;display:grid;place-items:center;font-size:17px;padding:0 10px}.dvb.sm{font-size:13px}
.dvs{flex:1;overflow:hidden;position:relative;display:flex;align-items:flex-start;justify-content:center}.dvc{transform-origin:0 0;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.dvc img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none;background:#fff}
.dvpdf{width:100%;height:100%;overflow-y:auto;touch-action:pan-y;padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px}.dvpage{width:100%;max-width:1100px;height:auto;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.5)}.dvpl{font-size:11px;opacity:.6;margin-bottom:10px}
.dvn{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:44px;height:64px;border:0;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-size:30px}.dvn.l{left:8px}.dvn.r{right:8px}.dvn:disabled{opacity:.2}
.dvfoot{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 8px calc(10px + env(safe-area-inset-bottom));background:rgba(0,0,0,.6);z-index:2}#dvZ{min-width:48px;text-align:center;font-size:13px;opacity:.8}
.dvdots{display:flex;gap:5px;margin-left:10px}.dvdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}.dvdots i.on{background:#fff}
.isum{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:12px;color:var(--mut)}.isum b{color:var(--ink);font-weight:600}.isum .on{color:var(--m)}.isum .on b{color:var(--m)}.isum .off{opacity:.55}
.wtl{margin-top:4px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}.wtl.none{font-weight:400;color:var(--warn);font-size:11px}
details.msel{position:relative}details.msel>summary{list-style:none;cursor:pointer;border:1px solid var(--ln);border-radius:10px;background:#fff;min-height:44px;padding:10px 30px 10px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
details.msel>summary::after{content:'▾';position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--mut)}details.msel>summary::-webkit-details-marker{display:none}
details.msel[open]>summary{border-color:var(--m)}.mslist{position:absolute;z-index:30;left:0;right:0;min-width:200px;top:calc(100% + 4px);background:#fff;border:1px solid var(--ln);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:8px;max-height:320px;overflow:auto}
.mslist label{display:flex;gap:8px;align-items:center;padding:8px 6px;border-radius:8px;font-size:14px;cursor:pointer}.mslist label:hover{background:var(--iv)}.mslist input{width:18px;height:18px;accent-color:var(--m)}
.wtp{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--ln);border-radius:12px;padding:10px 12px;background:#fff}
.addbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.addbar .btn{padding-left:6px;padding-right:6px}
.afbar{margin-bottom:12px}.afbar .selbar{display:flex;flex-wrap:wrap;gap:8px}.afbar .selbar .grow{min-width:150px;flex:1}@media(max-width:699px){.afbar .selbar{display:grid;grid-template-columns:1fr 1fr}.afbar .selbar .grow{min-width:0}.afbar .selbar .grow:last-child{grid-column:1/-1}}
.hrem{margin-top:12px;border-color:#F1D9A8;background:#FFFBF2}.hrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 0;border-top:1px solid var(--ln);background:none}.hrow:first-of-type{border-top:0}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:12px}
.dcard{display:flex;gap:12px;text-align:left;background:#fff;border:1px solid var(--ln);border-radius:14px;padding:10px;align-items:center;width:100%;min-width:0}.dcard .dbody{min-width:0}.dcard .b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dth{width:64px;height:64px;flex:none;border-radius:10px;background:var(--iv);display:grid;place-items:center;overflow:hidden;border:1px solid var(--ln)}.dth img{width:100%;height:100%;object-fit:cover}
.pdf{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:8px;background:var(--badb);color:var(--bad);font-weight:700;font-size:12px}
.dimg{width:100%;border-radius:12px;border:1px solid var(--ln);margin-bottom:8px;cursor:zoom-in;background:#fff}.dpdf{display:flex;gap:10px;align-items:center;border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:8px;background:#fff}
.dqr{text-align:center;background:#fff;border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}.dqr img{width:220px;max-width:80%}
.dfrow{display:grid;grid-template-columns:110px 1fr 30px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln);font-size:14px;word-break:break-word}.dfrow:last-child{border-bottom:0}
.cpy{border:0;background:var(--iv);border-radius:8px;width:30px;height:30px;display:grid;place-items:center;color:var(--m)}.lnk{border:0;background:none;color:var(--m);font-size:12px;text-decoration:underline;padding:0}
.dfiles{display:flex;flex-wrap:wrap;gap:8px}.df{position:relative;width:86px;height:86px;border-radius:10px;border:1px solid var(--ln);overflow:hidden;display:grid;place-items:center;background:#fff}.df img{width:100%;height:100%;object-fit:cover}
.df .x{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:0;font-size:14px;line-height:1}.df.add{flex-direction:column;gap:2px;color:var(--m);font-size:11px;text-align:center;cursor:pointer;border-style:dashed;display:flex;align-items:center;justify-content:center}
.pdoc .ptxt{font:13px/1.6 system-ui,sans-serif;white-space:pre-wrap;margin:8px 0}.pdoc .pimg{width:100%;max-height:250mm;object-fit:contain;page-break-before:always;display:block;margin-top:8px}
.cday{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cday button{text-align:left;background:#fff;border:1.5px solid var(--ln);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}.cday button.on{border-color:var(--m);background:var(--m3)}
.copen .amt2{font-size:26px;font-weight:700;color:var(--m)}.cfnotes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.cfnotes span{background:var(--iv);border:1px solid var(--ln);border-radius:99px;padding:3px 10px;font-size:12px}
.dcf{grid-column:2/4;font-size:11px;margin-top:-4px;text-align:center}.dcf.ok{color:var(--ok)}.dcf.bad{color:var(--bad);font-weight:600}
.cgrid{display:grid;gap:12px;margin-top:4px;max-width:760px}.ctitle{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px;margin-bottom:12px}
.tagc{font-size:11px;color:var(--m);background:var(--m3);border-radius:99px;padding:3px 9px;font-weight:500}.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.g2 .f{margin-top:0}.g2>div{min-width:0}.g2 select,.g2 input{width:100%}
.dhead,.drow{display:grid;grid-template-columns:62px 1fr 1fr;gap:9px;align-items:center}.dhead{font-size:11px;color:var(--mut);font-weight:600;padding-bottom:6px}.dhead span:not(:first-child){text-align:center}
.drow{padding:8px 0;border-top:1px solid var(--ln)}.dnote{background:var(--m3);color:var(--m);text-align:center;border-radius:9px;padding:10px 2px;font-weight:700}
.dent input{font-size:17px;font-weight:600;height:44px;text-align:center;padding:6px}.dent small{display:block;text-align:center;color:var(--mut);font-size:11px;margin-top:2px;min-height:14px}
.mini{border:1px solid var(--ln);background:var(--iv);border-radius:12px;padding:10px}.mini span{display:block;font-size:11px;color:var(--mut)}.mini strong{font-size:18px}
.ctotal{background:linear-gradient(135deg,#8F171B,#6E1014);color:#fff;border-radius:16px;padding:18px}.ctotal .amt{font-size:32px;font-weight:700;margin:2px 0}.ctotal .splits{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.25);margin-top:12px;padding-top:9px;font-size:12px;opacity:.9}
.cdiff{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:12px;background:var(--iv);border-radius:12px}.cdiff strong{font-size:22px}
.cst{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.3px}.cst.ok{background:var(--okb);color:var(--ok)}.cst.warn{background:var(--warnb);color:var(--warn)}.cst.bad{background:var(--badb);color:var(--bad)}.cst.pend{background:var(--pendb);color:var(--pend)}
.cact{display:grid;grid-template-columns:1fr 1fr;gap:9px}.cact .btn{display:flex;align-items:center;justify-content:center;gap:6px}.banner.ok{background:var(--okb);color:var(--ok);border-color:#BFE3CC}
.chist{width:100%;text-align:left;display:flex;gap:10px;align-items:center}
#printArea{display:none}@media print{body.printing #app,body.printing .toast{display:none!important}body.printing #printArea{display:block}}
.pchit{font:13px/1.4 system-ui,sans-serif;color:#000;max-width:640px;margin:0 auto}.pchit .ph{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:8px}.pchit .pl{font:700 26px Georgia,serif;letter-spacing:5px}.pchit .ps{font-size:10px;letter-spacing:2px}
.pchit table{width:100%;border-collapse:collapse;margin:6px 0}.pchit td,.pchit th{border:1px solid #999;padding:4px 6px;text-align:left}.pchit .pd td:not(:first-child),.pchit .pd th:not(:first-child){text-align:right}.pchit .pt td{font-weight:700}
.pchit .psig{display:flex;justify-content:space-between;margin-top:36px}.pchit .psig div{border-top:1px solid #000;width:42%;padding-top:4px}.pchit .pf{margin-top:18px;font-size:10px;color:#555}
.navver{display:none}.nav button.dk{display:none}.top .logo{background:none;border:0;color:inherit;text-align:left;cursor:pointer;padding:0}
.corelogo{font-family:'Cormorant Garamond',Georgia,serif;font-size:40px;letter-spacing:8px;color:var(--m);font-weight:700;line-height:1;margin:6px 0 4px}.corelogo small{display:block;font-family:Jost,system-ui;font-size:12px;letter-spacing:6px;color:var(--mut);margin-top:6px;font-weight:500}
/* splash */
.splash{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 20%,#A3242A 0%,#8F171B 45%,#5E0E12 100%);color:#fff;transition:opacity .5s ease,visibility .5s}
.splash.out{opacity:0;visibility:hidden}.splash .in{text-align:center;animation:spIn .9s cubic-bezier(.2,.8,.2,1) both}
.splash .w{font-family:'Cormorant Garamond',Georgia,serif;font-size:58px;font-weight:700;letter-spacing:14px;padding-left:14px;line-height:1}
.splash .c{font-family:Jost,system-ui;font-size:14px;letter-spacing:9px;padding-left:9px;margin-top:12px;opacity:.85}
.splash .ln{width:46px;height:1.5px;background:#E8C98A;margin:18px auto 0;animation:spLn 1.1s .3s ease both}
.splash .m{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font:12px Jost,system-ui;letter-spacing:2px;opacity:.6}
@keyframes spIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}@keyframes spLn{from{width:0}to{width:46px}}
/* hero home */
.hero{background:linear-gradient(135deg,#8F171B,#5E0E12);color:#fff;border-radius:18px;padding:20px 20px 18px;position:relative;overflow:hidden}
.hero:after{content:'';position:absolute;right:-40px;top:-50px;width:190px;height:190px;border-radius:50%;border:1.5px solid rgba(232,201,138,.35)}
.hero .hi{font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;font-weight:700;line-height:1.1}.hero .sub{opacity:.8;font-size:13px;margin-top:4px}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}@media(max-width:640px){.mods{grid-template-columns:1fr}}
.mod{display:block;text-align:left;width:100%;background:#fff;border:1px solid var(--ln);border-radius:18px;padding:16px;cursor:pointer;position:relative;transition:box-shadow .15s,transform .15s}
.mod:hover{box-shadow:0 6px 20px rgba(60,20,20,.08)}.mod:active{transform:scale(.99)}
.mod .num{font-size:12px;letter-spacing:2px;color:var(--mut);font-weight:600}.mod h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;margin:2px 0 2px;color:var(--m)}
.mod .ic{position:absolute;right:16px;top:16px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--m3);color:var(--m)}
.mod .stats{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}.mod .stats b{display:block;font-size:20px}.mod .stats span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.mod .go{margin-top:12px;font-weight:600;color:var(--m);font-size:14px}
.qk{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:12px}@media(max-width:640px){.qk{grid-template-columns:repeat(2,1fr)}}
.qk button{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--ink)}.qk button svg{color:var(--m)}.vbadge{display:inline-block;margin-top:8px;padding:2px 10px;border-radius:99px;background:var(--cr);color:var(--mut);font-size:12px}
.top .date{background:rgba(255,255,255,.14);border-radius:8px;padding:6px 10px;font-size:13px}
.bell{position:relative;width:40px;height:40px;border-radius:10px;color:#fff;display:grid;place-items:center}
.bell i{position:absolute;top:3px;right:3px;background:#FFD27A;color:var(--m2);font-style:normal;font-size:11px;font-weight:700;border-radius:99px;padding:0 5px;min-width:18px;text-align:center}
main{padding:14px;padding-bottom:96px;max-width:1300px;margin:0 auto}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom)}
/* Phone app shell (< 900 px, browser and Android app): top bar · scrolling content · bottom bar.
   The bottom bar is part of the layout (not floating), so it is always on screen; nothing can be swiped sideways. */
@media(max-width:899px){
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-y;max-width:100vw}
  #app{height:var(--vh,100dvh);min-height:0;display:flex;flex-direction:column;overflow:hidden}
  #app>.top{position:relative;flex:none}
  #app>main{flex:1 1 auto;min-height:0;width:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding-bottom:24px}
  #app>.nav{position:relative;flex:none;order:3;z-index:20}
  #app>.login{height:100%;overflow-y:auto}
  .tw{max-width:100%;touch-action:pan-x pan-y}
  .filters,.steps,.tabs{touch-action:pan-x pan-y}
  img,svg,table{max-width:100%}
}
.nav button{flex:1;padding:8px 2px 9px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--m);font-weight:600}
.banner{background:var(--warnb);color:var(--warn);padding:10px 14px;border-radius:10px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media(min-width:900px){
  .nav{top:0;bottom:0;right:auto;width:200px;flex-direction:column;border-top:0;border-right:1px solid var(--ln);padding-top:76px;gap:2px}
  .navver{display:block;margin-top:auto;padding:12px 18px 16px;font-size:12px;color:var(--mut)}
  .nav button.dk{display:flex}.phmore{display:none}
  .nav button{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:12px 20px;justify-content:flex-start}
  .nav button.on{background:var(--m3)}
  main{margin-left:200px;padding:22px 28px 110px;max-width:none}
  .top{z-index:30}
}
/* home */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--ln);border-radius:var(--r);padding:12px 14px}
.kpi .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}

<body>
<div id="app"></div>
<script type="module">

const $ = (s, el = document) => el.querySelector(s);

const VERSION = '1.26';

const svg = (k, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;

const S = { token: localStorage.ysc_token || '', me: null, D: null, view: 'home', date: null, filter: 'all', q: '', tab: 'users', modal: false, sumCache: null };

async function api(path, body) {
  const r = await fetch('/api/' + path, { method: body ? 'POST' : 'GET', headers: { 'content-type': 'application/json', ...(S.token ? { authorization: 'Bearer ' + S.token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({ error: 'Network error' }));
  if (r.status === 401 && path !== 'login') { logout(); throw new Error(j.error || 'Please log in'); }
  if (!r.ok) throw new Error(j.error || 'Error ' + r.status);
  return j;
}
function toast(msg, ms = 2600) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
const fail = (e) => toast('⚠ ' + e.message, 4000);
const img = (key) => `/api/img/${key}?t=${encodeURIComponent(S.token)}`;

// ---------------- login ----------------
let LG = { users: [], sel: null, pin: '' };
async function showLogin() {
  S.me = null; document.title = 'Yamie Core';
  try { const j = await api('login-list'); LG.users = j.users; } catch (e) { LG.users = []; }

  renderLogin();
}
function renderLogin() {
  $('#app').innerHTML = `<div class="login"><div class="lbox">
    <div class="corelogo">YAMIE<small>CORE</small></div><div class="mut sm">Stock · Cash</div><div class="vbadge">${esc(verText())}</div>
    <div class="users">${LG.users.map((u) => `<button data-u="${esc(u.id)}" class="${LG.sel === u.id ? 'on' : ''}"><div class="av">${esc(u.name[0] || '?')}</div><div class="sm">${esc(u.name)}</div><div class="mut" style="font-size:11px">${esc(u.role)}</div></button>`).join('') || '<div class="mut">Cannot reach server</div>'}</div>
    <div class="${LG.sel ? '' : 'hidden'}"><div class="mut sm">Enter PIN</div><div class="dots">${Array.from({ length: Math.max(4, LG.pin.length) }, (_, i) => `<i class="${i < LG.pin.length ? 'f' : ''}"></i>`).join('')}</div>
    <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '⌫', 0, '→'].map((k) => `<button data-k="${k}" ${k === '→' ? 'style="background:var(--m);color:#fff"' : ''}>${k}</button>`).join('')}</div></div>
  </div></div>`;
  $('#app').querySelectorAll('[data-u]').forEach((b) => b.onclick = () => { LG.sel = b.dataset.u; LG.pin = ''; renderLogin(); });
  $('#app').querySelectorAll('[data-k]').forEach((b) => b.onclick = () => padKey(b.dataset.k));
}
async function padKey(k) {
  if (k === '⌫') LG.pin = LG.pin.slice(0, -1);
  else if (k === '→') return doLogin();
  else if (LG.pin.length < 6) LG.pin += k;
  renderLogin();
}
async function doLogin() {
  if (LG.pin.length < 4) return toast('Enter your PIN');
  try {
    const j = await api('login', { userId: LG.sel, pin: LG.pin });
    S.token = j.token; localStorage.ysc_token = j.token; localStorage.ysc_last = LG.sel; S.me = j.user; S.view = 'home';
    await load();
  } catch (e) { LG.pin = ''; renderLogin(); fail(e); }
}
document.addEventListener('keydown', (e) => { if (S.me || !LG.sel) return; if (/^\d$/.test(e.key)) padKey(e.key); else if (e.key === 'Backspace') padKey('⌫'); else if (e.key === 'Enter') padKey('→'); });
function logout() { S.token = ''; localStorage.removeItem('ysc_token'); S.me = null; showLogin(); }

// ---------------- data ----------------
async function load(quiet) {
  try {
    const j = await api('state' + (S.date ? '?date=' + S.date : ''));
    const prevUnread = S.D?.alerts?.unread || 0;
    S.D = j; S.me = j.me; S.date = j.date === j.today ? null : j.date;
    S.round = roundOf(j.day);
    S.sum = summarize(j.locs, j.day.opening, j.mvs, roundCounts(j.counts, S.round), j.settings);
    const mT = S.round === 'morning' ? S.sum.total : summarize(j.locs, j.day.opening, j.mvs, roundCounts(j.counts, 'morning'), j.settings).total;
    S.rounds = { morning: { done: mT.locs - mT.pending, locs: mT.locs }, evening: S.round === 'evening' ? { done: S.sum.total.locs - S.sum.total.pending - S.sum.total.stale, locs: S.sum.total.locs } : { done: 0, locs: mT.locs } };
    S.eodCount = j.mvs.filter((m) => m.eod && !m.void).length;
    S.locById = Object.fromEntries(j.locs.map((l) => [l.id, l]));
    if (quiet && j.alerts.unread > prevUnread) notify(j.alerts.unread - prevUnread);
    if (!quiet || !S.modal) render();
    else renderTop();
  } catch (e) { if (S.token) fail(e); }
}
function notify(n) {
  if (localStorage.ysc_notify === '1' && 'Notification' in window && Notification.permission === 'granted') {
    try { new Notification('Yamie Stock Check', { body: `${n} new stock alert${n > 1 ? 's' : ''}`, icon: 'icon.svg' }); } catch {}
  } else toast(`🔔 ${n} new alert${n > 1 ? 's' : ''}`);
}
setInterval(() => { if (S.me && document.visibilityState === 'visible' && !S.modal) load(true); }, 40000);
document.addEventListener('visibilitychange', () => { if (S.me && document.visibilityState === 'visible' && !S.modal) load(true); });

const activeLocs = (sec) => S.D.locs.filter((l) => (l.active !== false || sumLines(S.sum.exp[l.id]?.lines)) && (!sec || l.sec === sec)).sort((a, b) => (a.order || 0) - (b.order || 0));
const expOf = (id) => S.sum.exp[id] || { lines: {}, wt: 0 };
const opOf = (id) => S.D.day.opening[id] || { lines: {}, wt: 0 };
const hideExp = () => S.D.settings.blind && !can('setup') && !can('move');
const secLabel = (k) => SECTIONS.find((s) => s.key === k)?.label || k;
const uname = (id) => (id === 'system' ? 'Yamie Core reminder' : S.D.userNames[id] || id);
const kT = (k, loc) => (loc || String(k).includes('@') ? keyText(loc, k) : k);
const JT_CHIP = { 'Platinum': 'pt', 'Diamond Jewellery': 'dia', 'Tanih - CVD Jewellery': 'cvd', Silver: 'ag' };
const jtNames = (l) => { const a = locJts(l); return a.length ? a.map((j) => JT_LABEL[j]).join(' + ') : (l.jtype === 'Mixed' ? 'Mixed' : ''); };
const jtChips = (l) => { const a = locJts(l); return a.length ? a.map((j) => `<span class="chip ${JT_CHIP[j] || 'au'}">${esc(JT_LABEL[j])}</span>`).join('') : l.jtype ? `<span class="chip au">${esc(l.jtype)}</span>` : ''; };
// types offered for new items at a location: its ticked types first, then the rest
const jtOrder = (l) => { const a = locJts(l); const first = a.length ? a : [defaultJt(l)]; return [...first, ...LINE_JTYPES.filter((j) => !first.includes(j))]; };
const jtB = (jt) => `<span class="jtb ${JT_CLS[jt] || 'g'}">${JT_SHORT[jt] || 'Gold'}</span>`;
const kL = (loc, k) => { const p = purOfLine(loc, k); return `${jtB(jtOfLine(loc, k))}${p ? `<span class="pub">${esc(p)}</span>` : ''}<span class="b">${esc(itemOf(k))}</span>`; };
const linesTxt = (l, loc) => Object.entries(l || {}).filter(([, n]) => n).map(([t, n]) => `${kT(t, loc)} ${fmt(n)}`).join(', ') || '—';
const diffTxt = (d, loc) => Object.entries(d || {}).map(([t, n]) => `${kT(t, loc)} ${sgn(n)}`).join(', ');

// ---------------- shell ----------------
// v1.17 Yamie Core: phone bottom bar = Home · Cash · Counter · Trays · Box; the computer sidebar also has Stock, Consolidated and More
const NAV = [['home', 'Home', 'home'], ['stock', 'Stock', 'stock', 1], ['cash', 'Cash', 'cash'], ['counter', 'Counter', 'counter'], ['tray', 'Trays', 'tray'], ['box', 'Box', 'box'], ['total', 'Consolidated', 'total', 1], ['docs', 'Documents', 'doc', 1], ['more', 'More', 'more', 1]];
const MORE_VIEWS = ['more', 'alerts', 'log', 'admin', 'history', 'eod'];
function render() {
  if (!S.me) return showLogin();
  document.title = `Yamie Core · ${S.D.date}`;
  const navOn = (k) => S.view === k || (k === 'more' && MORE_VIEWS.includes(S.view)) || (k === 'home' && innerWidth < 900 && (S.view === 'stock' || S.view === 'total' || S.view === 'docs' || MORE_VIEWS.includes(S.view)));

  $('#app').querySelectorAll('[data-nav]').forEach((b) => b.onclick = () => go(b.dataset.nav));
  renderTop();

  v();
}
// v1.16: version on screen — web app version, plus the APK version inside the Android app
const apkVer = () => { try { return window.YamieStock?.version?.() || ''; } catch { return ''; } };
const verText = () => `App v${VERSION}${apkVer() ? ` · APK ${apkVer()}` : ''}`;
function renderTop() {
  const t = $('#top'); if (!t) return;
  const d = S.D;
  t.innerHTML = `<button class="logo grow" id="logoBtn">Yamie<small>Core <span class="vtag" title="${esc(verText())}">v${VERSION}</span></small></button>
    <button class="date" id="dateBtn">${isToday() ? 'Today' : '📅'} ${new Date(d.date + 'T00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short' })} · ${d.day.status === 'closed' ? 'Closed' : 'Open'}</button>
    ${can('alerts') ? `<button class="bell" id="bellBtn" title="Alerts">${svg('bell')}${d.alerts.unread ? `<i>${d.alerts.unread}</i>` : ''}</button>` : ''}
    <button class="bell phmore" id="moreBtn" title="More">${svg('more')}</button>`;
  $('#logoBtn').onclick = () => go('home');
  $('#moreBtn').onclick = () => go('more');
  $('#dateBtn').onclick = () => can('reports') ? go('history') : null;

}
function go(v) { S.view = v; S.filter = 'all'; S.q = ''; if (v === 'total') S.tab = ''; render(); scrollTo(0, 0); $('#main')?.scrollTo(0, 0); }
function viewBanner() {
  if (isToday()) return S.D.day.status === 'closed' ? `<div class="banner">Today is closed — stock is locked. ${S.me.role === 'admin' ? '<button class="btn sm sec" id="reopenBtn">Reopen today</button>' : ''}</div>` : '';
  return `<div class="banner">Viewing ${dt(S.D.date)} (${S.D.day.status}) — read only <button class="btn sm sec" id="backToday">Back to today</button></div>`;
}
function bindBanner() {
  $('#backToday') && ($('#backToday').onclick = () => { S.date = null; load(); });
  $('#reopenBtn') && ($('#reopenBtn').onclick = async () => { if (!confirm('Reopen today? Stock can be changed again and the day must be closed again.')) return; try { await api('reopen', {}); toast('Day reopened'); load(); } catch (e) { fail(e); } });
}

// ---------------- day flow: morning count → entries → evening count → close ----------------
function dayFlow() {
  const R = S.rounds; const ev = S.round === 'evening'; const closed = S.D.day.status === 'closed';
  const st = (done, cur) => done ? 'done' : cur ? 'cur' : '';
  const mDone = R.morning.done >= R.morning.locs, eDone = ev && R.evening.done >= R.evening.locs;
  return `<div class="flow">
    <div class="fs ${st(mDone, !ev)}"><i>☀</i><div><b>Morning count</b><span>${R.morning.done}/${R.morning.locs} verified</span></div></div>
    <div class="fs ${st(ev, mDone && !ev)}" data-flow="eod"><i>🧾</i><div><b>End-of-day entries</b><span>${S.eodCount} entr${S.eodCount === 1 ? 'y' : 'ies'}${ev ? ' · done' : ''}</span></div></div>
    <div class="fs ${st(eDone, ev && !eDone)}"><i>🌙</i><div><b>Evening count</b><span>${ev ? `${R.evening.done}/${R.evening.locs} verified` : 'after entries'}</span></div></div>
    <div class="fs ${st(closed, eDone && !closed)}" data-flow="close"><i>🔒</i><div><b>Close day</b><span>${closed ? 'closed' : 'both counts compulsory'}</span></div></div></div>`;
}

// ---------------- end-of-day entries ----------------
// Opening = today's opening at that location for the item; Closing = stock now ± this row (and earlier unsaved rows for the same location + item)
function eodCalc(rows, i) {
  const r = rows[i]; const l = S.locById[r.locId]; if (!l || !r.item) return null;
  const sign = (TXN_TYPES.find((t) => t.k === r.type)?.dir) || -1; const box = l.sec === 'box';
  const op = opOf(l.id).lines[r.item] || 0, opWt = box ? +(opOf(l.id).wt || 0) : 0;
  const now = expOf(l.id).lines[r.item] || 0, nowWt = box ? +(expOf(l.id).wt || 0) : 0;
  let before = now, beforeWt = nowWt;
  for (let j = 0; j < i; j++) { const x = rows[j]; if (x.locId !== r.locId) continue; const sg = (TXN_TYPES.find((t) => t.k === x.type)?.dir) || -1; if (x.item === r.item) before += sg * (+x.qty || 0); if (box && (nowWt > 0 || sg > 0)) beforeWt += sg * (+x.wt || 0); }
  const cl = before + sign * (+r.qty || 0); const clWt = r3(beforeWt + (box && (nowWt > 0 || sign > 0) ? sign * (+r.wt || 0) : 0));
  return { op, opWt, now, nowWt, cl, clWt, sign, chg: sign * (+r.qty || 0) };
}
const eodClHtml = (oc, box) => oc ? `<b>${fmt(oc.cl)}</b>${box ? `<span>${g3(oc.clWt)} g</span>` : ''}<span class="mut">${oc.chg ? sgn(oc.chg) : ''}</span>` : '<span class="mut">—</span>';

    if (neg.length && !confirm(`Closing goes below zero for ${neg.map(([r]) => `${S.locById[r.locId].name} · ${r.item}`).join(', ')}. Save anyway?`)) return;

  });

  $('#backMorning') && ($('#backMorning').onclick = async () => { if (!confirm('Go back to the morning count? Evening counts stay saved but are not used until evening starts again.')) return; try { await api('round', { date: S.D.date, round: 'morning' }); await load(true); vEod(); } catch (e) { fail(e); } });
}

function secCard(s) {

  return `<button class="card seccard" data-sec="${s.key}"><div class="row sp"><div class="row" style="color:var(--m)">${svg(s.key, 24)}<h3 style="color:var(--ink)">${s.label}</h3></div><span class="mut">›</span></div>
    <div class="bar"><span style="width:${X.ok / n * 100}%;background:var(--ok)"></span><span style="width:${(X.var + X.stale) / n * 100}%;background:var(--bad)"></span></div>

function startPanel(scope) {
  if (!can('count') || !editable()) return '';
  const P = sessProgress(orderFor(scope)); const mine = (S.D.sessions || []).find((x) => x.by === S.me.id && x.scope === scope && !x.ids && (x.round || 'morning') === S.round && x.status === 'active');
  const all = P.done === P.total;
  return `<div class="startp"><div class="grow"><div class="b" style="font-size:17px">${S.round === 'evening' ? '🌙 Evening' : '☀ Morning'} · ${scopeLabel(scope)}</div><div class="sm" style="opacity:.85">${P.done}/${P.total} ${scope === 'box' ? 'boxes' : 'trays'} verified · ${P.gDone}/${P.gTotal} ${scope === 'counter' ? 'counters' : 'groups'} complete</div>
    <div class="bar" style="background:rgba(255,255,255,.25)"><span style="width:${P.done / (P.total || 1) * 100}%;background:#fff"></span></div></div>
    <button class="btn" data-start="${scope}">${all ? 'View summary' : mine || P.done ? 'Resume count ›' : 'Start count ›'}</button></div>`;
}
function bindStart() { $('#main').querySelectorAll('[data-start]').forEach((b) => b.onclick = () => startCount(b.dataset.start)); }

// ---------------- section list ----------------
function vSection(sec) {
  const all = activeLocs(sec); const st = S.sum.status; const X = S.sum.sec[sec];
  const q = S.q.toLowerCase();
  // selectors (v1.8): counter = Main location → Sub display → Counter; tray = Item → Tray; box = Box → Item; all + Jewellery type
  const SEL = ((S.sel ||= {})[sec] ||= {});
  const boxLbl = (l) => `${l.boxNo && !l.name.includes(l.boxNo) ? `Box ${l.boxNo} · ` : ''}${l.name}`;
  // v1.15 selectors. Kinds: plain (fn on location), 'jt' jewellery type, 'item' item held, 'pur' purity held.
  const held = (l) => Object.entries(expOf(l.id).lines).filter(([, n]) => n);
  const KIND = {
    jt: { opts: (pool) => LINE_JTYPES.filter((j) => pool.some((l) => KIND.jt.has(l, j))).map((j) => [j, JF_LBL[j] || j]), has: (l, v) => locJts(l).includes(v) || held(l).some(([k]) => jtOfLine(l, k) === v) },
    item: { opts: (pool) => { const set = new Set(pool.flatMap((l) => [...held(l).map(([k]) => itemOf(k)), ...(l.itemType ? [l.itemType] : [])])); return [...S.D.settings.itemTypes.filter((t) => set.has(t)), ...[...set].filter((t) => !S.D.settings.itemTypes.includes(t))].map((v) => [v, v]); }, has: (l, v) => l.itemType === v || held(l).some(([k]) => itemOf(k) === v) },
    pur: { opts: (pool) => [...new Set(pool.flatMap((l) => [...held(l).map(([k]) => purOfLine(l, k) || 'Not set'), ...(l.purity && !held(l).length ? [l.purity] : [])]))].sort((a, b) => PUR_ORDER(a) - PUR_ORDER(b)).map((v) => [v, v]), has: (l, v) => held(l).some(([k]) => (purOfLine(l, k) || 'Not set') === v) || (!held(l).length && (l.purity || 'Not set') === v) },
  };
  const LJ = ['j', 'Jewellery type', null, null, 'jt'], LI = ['i', 'Item', null, null, 'item'], LP = ['p', 'Purity', null, null, 'pur'];
  const LV = sec === 'counter' ? [['a', 'Main location', (l) => l.area || '—'], ['b', 'Sub display', (l) => l.sub || '—'], LJ, LI, LP, ['c', 'Counter', (l) => l.group]]
    : sec === 'tray' ? [['a', 'Item group', (l) => l.group], LJ, LP, ['b', 'Tray', (l) => l.id, (l) => `${l.name}${l.insert ? ` (${l.insert} × ${l.qty || 1})` : ''}`]]
    : [LJ, LI, LP, ['a', 'Box', (l) => l.id, boxLbl]];
  // v1.25: jewellery type / item / purity are multi-select (arrays) and must match on the same item line
  for (const k of ['j', 'i', 'p']) if (SEL[k] && !Array.isArray(SEL[k])) SEL[k] = [SEL[k]]; else SEL[k] ||= [];
  const LF = { j: SEL.j, i: SEL.i, p: SEL.p }; const lfOn = LF.j.length || LF.i.length || LF.p.length;
  const lineVal = (l, k, key) => k === 'j' ? jtOfLine(l, key) : k === 'i' ? itemOf(key) : purOfLine(l, key) || 'Not set';
  const emptyVal = (l, k) => k === 'j' ? locJts(l) : k === 'i' ? (l.itemType ? [l.itemType] : []) : [l.purity || 'Not set'];
  const lineMatch = (l, key, skip) => ['j', 'i', 'p'].every((k) => k === skip || !LF[k].length || LF[k].includes(lineVal(l, k, key)));
  const locLineOk = (l, skip) => { const h = held(l); if (!h.length) return ['j', 'i', 'p'].every((k) => k === skip || !LF[k].length || emptyVal(l, k).some((v) => LF[k].includes(v))); return h.some(([key]) => lineMatch(l, key, skip)); };
  const passLv = (l, lv) => { if (lv[4]) return true; const v = SEL[lv[0]]; if (!v) return true; return lv[2](l) === v; };
  const inSel = (l) => LV.every((lv) => passLv(l, lv)) && (!lfOn || locLineOk(l));
  const lvOpts = LV.map((lv, i) => { const before = LV.slice(0, i).filter((p) => !p[4]);
    const pool = all.filter((l) => before.every((p) => passLv(l, p)) && (lv[4] ? true : !lfOn || locLineOk(l)));
    if (lv[4]) { const k = lv[0]; const vals = new Set(pool.flatMap((l) => { const h = held(l); return h.length ? h.filter(([key]) => lineMatch(l, key, k)).map(([key]) => lineVal(l, k, key)) : locLineOk(l, k) ? emptyVal(l, k) : []; }));
      const arr = k === 'j' ? LINE_JTYPES.filter((j) => vals.has(j)).map((j) => [j, JF_LBL[j] || j]) : k === 'i' ? [...S.D.settings.itemTypes.filter((t) => vals.has(t)), ...[...vals].filter((t) => !S.D.settings.itemTypes.includes(t))].map((v) => [v, v]) : [...vals].sort((a, b) => PUR_ORDER(a) - PUR_ORDER(b)).map((v) => [v, v]);
      for (const v of SEL[k]) if (!arr.some((o) => o[0] === v)) arr.push([v, k === 'j' ? JF_LBL[v] || v : v]); return arr; }
    const m = new Map(); pool.forEach((l) => { const v = lv[2](l); if (!m.has(v)) m.set(v, lv[3] ? lv[3](l) : v); }); return [...m.entries()]; });
  S.cardF = lfOn ? { l: (l, key) => lineMatch(l, key) } : null;   // cards show matching pieces
  const selIds = all.filter(inSel).map((l) => l.id);
  const has = (lv) => lv[4] ? SEL[lv[0]].length > 0 : !!SEL[lv[0]];
  const selOn = LV.some(has);
  const selName = LV.filter(has).map((lv) => lv[4] ? SEL[lv[0]].map((v) => lv[0] === 'j' ? JF_LBL[v] || v : v).join(' + ') : (lvOpts[LV.indexOf(lv)].find((o) => o[0] === SEL[lv[0]])?.[1]) || SEL[lv[0]]).join(' · ');
  const selPend = selIds.filter((i) => ['pending', 'stale'].includes(st[i].state)).length;
  const unit = sec === 'box' ? 'box' : 'tray'; const units = sec === 'box' ? 'boxes' : 'trays';
  const plural = (t) => ({ Box: 'boxes', 'Sub display': 'sub displays', 'Jewellery type': 'jewellery types', 'Main location': 'main locations', Purity: 'purities', 'Item group': 'item groups' }[t] || t.toLowerCase() + 's');
  const selBar = `<div class="selbar card">

async function shrink(file, max = 1280) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.78);
}

    <div class="row"><div class="grow"><label class="f">Reason</label><select id="mReason">${(k.kind === 'move' ? ['Counter refill', 'Back to buffer', 'Box to tray', 'Tray to box', 'Rearrange'] : REASONS[k.kind].filter((r) => r !== 'Stock withdrawal' || S.me.role === 'admin')).map((r) => `<option ${r === k.reason ? 'selected' : ''}>${r}</option>`).join('')}</select></div>

// Items in a location: Jewellery type · Item · Qty rows (add / edit / delete)
function itemsEditor(loc, rows, allowed = () => locJts(loc)) {
  const types = S.D.settings.itemTypes;
  const html = () => `<div class="ied">${rows.map((r, i) => `<div class="iedr">
      <select data-ij="${i}" class="jt-${JT_CLS[r.jt] || 'g'}">${(() => { const a = allowed(); return a.length ? LINE_JTYPES.filter((j) => a.includes(j) || j === r.jt) : LINE_JTYPES; })().map((j) => `<option value="${esc(j)}" ${r.jt === j ? 'selected' : ''}>${esc(JT_LABEL[j])}</option>`).join('')}</select>
      <select data-ip="${i}"><option value="">Purity…</option>${[...new Set([...S.D.settings.purities, ...(r.pur ? [r.pur] : [])])].map((p) => `<option ${r.pur === p ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select>
      <select data-ii="${i}"><option value="">Item…</option>${types.map((t) => `<option ${r.item === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
      <input type="number" inputmode="numeric" min="0" data-in="${i}" value="${esc(r.n)}" placeholder="Qty">
      <button type="button" class="x" data-idel="${i}" title="Delete item">×</button></div>`).join('') || '<div class="mut sm" style="padding:6px 0">No items</div>'}
    <div class="row sp" style="margin-top:6px"><button type="button" class="btn sm ghost" id="iAdd">＋ Add item</button><span class="mut sm" id="iTot"></span></div></div>`;
  const tot = (root) => { const by = {}; rows.forEach((r) => { if (+r.n > 0) by[JT_SHORT[r.jt]] = (by[JT_SHORT[r.jt]] || 0) + +r.n; }); const pb = {}; rows.forEach((r) => { if (+r.n > 0 && r.pur) pb[r.pur] = (pb[r.pur] || 0) + +r.n; }); const t = root.querySelector('#iTot'); if (t) t.title = Object.entries(pb).map(([k, v]) => `${k} ${v}`).join(' · '); if (t) t.textContent = `${rows.reduce((a, r) => a + (+r.n || 0), 0)} pcs` + (Object.keys(by).length > 1 ? ` · ${Object.entries(by).map(([k, v]) => `${k} ${v}`).join(' · ')}` : ''); };
  const bind = (root, rerender) => {
    tot(root);
    root.querySelectorAll('[data-ij]').forEach((el) => el.onchange = () => { rows[el.dataset.ij].jt = el.value; rerender(); });
    root.querySelectorAll('[data-ii]').forEach((el) => el.onchange = () => { rows[el.dataset.ii].item = el.value; });
    root.querySelectorAll('[data-ip]').forEach((el) => el.onchange = () => { rows[el.dataset.ip].pur = el.value; });
    root.querySelectorAll('[data-in]').forEach((el) => el.oninput = () => { rows[el.dataset.in].n = el.value; tot(root); });
    root.querySelectorAll('[data-idel]').forEach((b) => b.onclick = () => { rows.splice(+b.dataset.idel, 1); rerender(); });
    root.querySelector('#iAdd').onclick = () => { const last = rows[rows.length - 1]; rows.push({ jt: (last?.jt && (!allowed().length || allowed().includes(last.jt)) ? last.jt : allowed()[0]) || defaultJt(loc), pur: last ? last.pur : defaultPur(loc), item: '', n: '' }); rerender(); };
  };
  // lines keyed for the (possibly edited) location
  const toLines = (forLoc) => { const out = {}; for (const r of rows) { if (!r.item || !(+r.n > 0)) continue; const k = lineKey(forLoc, r.item, r.jt, r.pur || ''); out[k] = (out[k] || 0) + Math.round(+r.n); } return out; };
  const invalid = () => rows.find((r) => (+r.n > 0) && !r.item);
  return { html, bind, toLines, invalid };
}
const rowsFromLines = (loc, lines) => Object.entries(lines || {}).filter(([, n]) => n).map(([k, n]) => ({ jt: jtOfLine(loc, k), pur: purOfLine(loc, k), item: itemOf(k), n }))
  .sort((a, b) => (S.D.settings.itemTypes.indexOf(a.item) - S.D.settings.itemTypes.indexOf(b.item)) || (LINE_JTYPES.indexOf(a.jt) - LINE_JTYPES.indexOf(b.jt)));
const sameLines = (a, b) => { const ks = new Set([...Object.keys(a), ...Object.keys(b)]); for (const k of ks) if ((a[k] || 0) !== (b[k] || 0)) return false; return true; };

// ---------------- location delete ----------------
async function delLoc(l) {
  const e = expOf(l.id); const has = sumLines(e.lines) || e.wt;
  let reason = '';
  if (has) {
    if (S.me.role !== 'admin') return toast(`${l.name} still holds ${fmt(sumLines(e.lines))} pcs — move it or set it to zero first (or ask admin)`, 4500);
    reason = prompt(`${l.name} still holds ${fmt(sumLines(e.lines))} pcs${e.wt ? ` / ${g3(e.wt)} g` : ''}. Deleting writes this stock off to zero (logged and sent to alerts).\n\nReason:`);
    if (!reason || !reason.trim()) return;
  } else if (!confirm(`Delete ${l.name}?`)) return;
  try { await api('loc', { loc: { id: l.id, active: false }, reason }); toast(`${l.name} deleted`); closeModal(); await load(); } catch (er) { fail(er); }
}

    ${ok ? `<div class="row" style="gap:6px"><button class="btn sm ghost" data-wt="add">＋ Add</button><button class="btn sm ghost" data-wt="edit">✎ Edit</button>${w ? '<button class="btn sm ghost" data-wt="del" style="color:var(--bad)">🗑</button>' : ''}</div>` : ''}</div>`; };
function addLoc(sec) { const st = S.D.settings; locEdit({ sec, group: sec === 'counter' && SEL_LAST.counter ? SEL_LAST.counter : '', name: '', cat: '', area: sec === 'counter' ? st.areas[0] : st.areas.includes('Locker Area') ? 'Locker Area' : st.areas[0], sub: sec === 'counter' ? st.subDisplays[0] : '', jtype: JTYPES[0], images: [], mode: 'both' }); }
const SEL_LAST = {};
function admLocs() {
  const st = S.D.settings; S.af ||= { sec: 'all', area: '', sub: '', group: '', jt: '', item: '', pur: '', q: '' }; const F = S.af;
  const pool = activeLocs().filter((l) => F.sec === 'all' || l.sec === F.sec);
  // item / purity / jewellery type must match the same item line (e.g. Ring + 22K = 22K rings); an empty location uses its own settings
  const lineOk = (l, skip) => { const h = heldOf(l); const want = (k, v) => k === skip || !F[k] || F[k] === v;
    if (!h.length) return want('item', l.itemType || '') && want('pur', l.purity || 'Not set') && (skip === 'jt' || !F.jt || locJts(l).includes(F.jt));
    return h.some(([k]) => want('item', itemOf(k)) && want('pur', purOfLine(l, k) || 'Not set') && want('jt', jtOfLine(l, k))); };
  const tests = [['area', (l) => (l.area || '—') === F.area], ['sub', (l) => (l.sub || '—') === F.sub], ['group', (l) => l.group === F.group], ['line', (l, skip) => lineOk(l, skip)],
    ['q', (l) => `${l.name} ${l.group} ${l.boxNo || ''} ${l.id} ${l.cat || ''}`.toLowerCase().includes(F.q.toLowerCase())]];
  const pass = (l, skip) => tests.every(([k, f]) => k === 'line' ? (!F.item && !F.pur && !F.jt) || ((skip === 'item' || skip === 'pur' || skip === 'jt') && !['item', 'pur', 'jt'].some((x) => x !== skip && F[x])) || f(l, skip) : k === skip || !F[k] || f(l));
  // options for item / purity / type come from the lines that match the other two
  const lineVals = (pl, k) => pl.flatMap((l) => { const h = heldOf(l); const want = (kk, v) => kk === k || !F[kk] || F[kk] === v;
    const ok = h.filter(([key]) => want('item', itemOf(key)) && want('pur', purOfLine(l, key) || 'Not set') && want('jt', jtOfLine(l, key)));
    return h.length ? ok.map(([key]) => k === 'item' ? itemOf(key) : k === 'pur' ? purOfLine(l, key) || 'Not set' : jtOfLine(l, key)) : k === 'item' ? (l.itemType ? [l.itemType] : []) : k === 'pur' ? [l.purity || 'Not set'] : locJts(l); });
  const opts = (k, vals) => { const pl = pool.filter((l) => pass(l, k)); return vals(pl); };
  const uniq = (a) => [...new Set(a)].filter((x) => x != null && x !== '');
  const O = {
    area: opts('area', (pl) => uniq(pl.map((l) => l.area || '—'))), sub: opts('sub', (pl) => uniq(pl.filter((l) => l.sec === 'counter').map((l) => l.sub || '—'))),
    group: opts('group', (pl) => uniq(pl.map((l) => l.group))), jt: opts('jt', (pl) => { const set = new Set(lineVals(pl, 'jt')); return LINE_JTYPES.filter((j) => set.has(j)); }),
    item: opts('item', (pl) => { const set = new Set(lineVals(pl, 'item')); return [...st.itemTypes.filter((t) => set.has(t)), ...[...set].filter((t) => !st.itemTypes.includes(t))]; }),
    pur: opts('pur', (pl) => uniq(lineVals(pl, 'pur')).sort((a, b) => PUR_ORDER(a) - PUR_ORDER(b))) };
  const lineF = F.item || F.pur || F.jt;
  const matchPcs = (l) => !lineF ? sumLines(expOf(l.id).lines) : heldOf(l).filter(([k]) => (!F.item || itemOf(k) === F.item) && (!F.pur || (purOfLine(l, k) || 'Not set') === F.pur) && (!F.jt || jtOfLine(l, k) === F.jt)).reduce((a, [, n]) => a + n, 0);
  const shown = pool.filter((l) => pass(l)); const active = Object.entries(F).filter(([k, v]) => v && v !== 'all').length;
  const sel = (k, label, list, lbl = (v) => v) => `<div class="grow"><label class="f">${label}</label><select data-af="${k}"><option value="">All</option>${list.map((v) => `<option value="${esc(v)}" ${F[k] === v ? 'selected' : ''}>${esc(lbl(v))}</option>`).join('')}${F[k] && !list.includes(F[k]) ? `<option value="${esc(F[k])}" selected>${esc(lbl(F[k]))}</option>` : ''}</select></div>`;
  const bar = `<div class="card afbar">
    <div class="seg" style="margin-bottom:8px">${[['all', 'All'], ['counter', 'Counter'], ['tray', 'Buffer trays'], ['box', 'Boxes']].map(([k, t]) => `<button data-afs="${k}" class="${F.sec === k ? 'on' : ''}">${t} <span class="sm" style="opacity:.7">${k === 'all' ? activeLocs().length : activeLocs(k).length}</span></button>`).join('')}</div>
    <div class="selbar" style="padding:0;border:0;background:none">
      ${sel('area', 'Main location', O.area)}${F.sec === 'all' || F.sec === 'counter' ? sel('sub', 'Sub display', O.sub) : ''}${sel('group', F.sec === 'tray' ? 'Item group' : F.sec === 'counter' ? 'Counter' : 'Group', O.group)}
      ${sel('jt', 'Jewellery type', O.jt, (j) => JF_LBL[j] || j)}${sel('item', 'Item', O.item)}${sel('pur', 'Purity', O.pur)}
      <div class="grow"><label class="f">Search</label><input type="search" id="afQ" value="${esc(F.q)}" placeholder="Name, box no., tag…"></div></div>
    <div class="row sp" style="margin-top:8px"><span class="mut sm">Showing <b>${shown.length}</b> of ${activeLocs().length} · ${lineF ? `<b>${fmt(shown.reduce((a, l) => a + matchPcs(l), 0))}</b> matching pcs (${fmt(shown.reduce((a, l) => a + sumLines(expOf(l.id).lines), 0))} in these locations)` : `${fmt(shown.reduce((a, l) => a + sumLines(expOf(l.id).lines), 0))} pcs`}</span>${active ? '<button class="btn sm ghost" id="afClr">✕ Clear filters</button>' : ''}</div></div>`;
  const filtered = active > 0;
  const addBar = can('setup') && editable() ? `<div class="addbar"><button class="btn" data-addn="counter">＋ Counter tray</button><button class="btn" data-addn="tray">＋ Buffer tray</button><button class="btn" data-addn="box">＋ Box</button></div>` : '';
  $('#adm').innerHTML = `<div class="mut sm" style="margin-bottom:10px">Add, edit or delete counters, trays and boxes. Tap a name to open it (photos, stock). ${editable() ? '' : '<b>Day is closed — reopen today’s day to add or change locations.</b>'}</div>` + addBar + bar + SECTIONS.filter((s) => F.sec === 'all' || F.sec === s.key).filter((s) => !filtered || shown.some((l) => l.sec === s.key) || F.sec === s.key).map((s) => `<div class="grp"><span>${s.label} (${filtered ? `${shown.filter((l) => l.sec === s.key).length} of ` : ''}${activeLocs(s.key).length})</span>${editable() ? `<button class="btn sm sec" data-add="${s.key}">＋ Add ${s.key === 'counter' ? 'counter tray' : s.key === 'tray' ? 'tray' : 'box'}</button>` : ''}</div>
    <div class="tw"><table><tr><th>Name</th>${s.key === 'counter' ? '<th>Main location</th><th>Sub display</th>' : '<th>Main location</th>'}<th>Group</th><th>Jewellery type</th><th>Purity</th><th>Item</th><th>Pcs</th><th>Weight g</th><th></th></tr>${shown.filter((l) => l.sec === s.key).map((l) => `<tr><td class="b" data-loc="${l.id}" style="cursor:pointer;text-decoration:underline dotted">${esc(l.name)}${l.boxNo ? ` <span class="chip m">${esc(l.boxNo)}</span>` : ''}</td><td style="text-align:left">${esc(l.area || '—')}</td>${s.key === 'counter' ? `<td style="text-align:left">${esc(l.sub || '—')}</td>` : ''}<td style="text-align:left">${esc(l.group)}</td><td style="text-align:left">${jtChips(l) || '—'}</td><td style="text-align:left">${esc(locPurs(l).join(', '))}</td><td style="text-align:left" class="sm">${esc(locItems(l).join(', ') || l.itemType || '—')}</td><td>${lineF ? `<b>${fmt(matchPcs(l))}</b> <span class="mut sm">/ ${fmt(sumLines(expOf(l.id).lines))}</span>` : fmt(sumLines(expOf(l.id).lines))}</td><td class="${expOf(l.id).wt || s.key !== 'box' ? '' : 'neg'}">${expOf(l.id).wt ? g3(expOf(l.id).wt) : s.key === 'box' ? 'not set' : '—'}${can('setup') && editable() ? ` <button class="lnk" data-wtl="${l.id}">${expOf(l.id).wt ? 'edit' : 'add'}</button>` : ''}</td>
      <td style="white-space:nowrap">${can('setup') && editable() ? `<button class="btn sm ghost" data-edit="${l.id}">✎ Edit</button> <button class="btn sm ghost" data-delloc="${l.id}" style="color:var(--bad)">🗑</button>` : ''}</td></tr>`).join('')}</table></div>`).join('');
  $('#adm').querySelectorAll('[data-afs]').forEach((b) => b.onclick = () => { F.sec = b.dataset.afs; if (F.sec !== 'all' && F.sec !== 'counter') F.sub = ''; admLocs(); });
  $('#adm').querySelectorAll('[data-af]').forEach((el) => el.onchange = () => { F[el.dataset.af] = el.value; admLocs(); });
  $('#afQ').oninput = () => { F.q = $('#afQ').value; const pos = $('#afQ').selectionStart; admLocs(); const q = $('#afQ'); q.focus(); q.setSelectionRange(pos, pos); };
  $('#afClr') && ($('#afClr').onclick = () => { S.af = { sec: F.sec, area: '', sub: '', group: '', jt: '', item: '', pur: '', q: '' }; admLocs(); });
  $('#adm').querySelectorAll('[data-loc]').forEach((r) => r.onclick = () => locSheet(r.dataset.loc));
  $('#adm').querySelectorAll('[data-wtl]').forEach((b) => b.onclick = () => weightAction(S.locById[b.dataset.wtl], expOf(b.dataset.wtl).wt ? 'edit' : 'add'));
  $('#adm').querySelectorAll('[data-edit]').forEach((b) => b.onclick = () => locEdit(S.locById[b.dataset.edit]));
  $('#adm').querySelectorAll('[data-delloc]').forEach((b) => b.onclick = () => delLoc(S.locById[b.dataset.delloc]));
  $('#adm').querySelectorAll('[data-add],[data-addn]').forEach((b) => b.onclick = () => addLoc(b.dataset.add || b.dataset.addn));
}
function admSettings() {
  const st = S.D.settings;
  $('#adm').innerHTML = `<div class="card">
    <label class="f">Shop name</label><input type="text" id="sN" value="${esc(st.shopName)}">
    <label class="f">Admin WhatsApp number for reports (with country code, e.g. 9187141 22750)</label><input type="tel" id="sW" value="${esc(st.waNumber)}" placeholder="91XXXXXXXXXX">
    <label class="f">Box weight tolerance (± grams)</label><input type="number" step="0.001" id="sT" value="${st.wtTol}">
    <label class="chk" style="margin-top:10px"><input type="checkbox" id="sPh" ${st.reqPhotos ? 'checked' : ''}> Require item photos — one photo per piece before a tray can be submitted</label>
    <label class="chk"><input type="checkbox" id="sB" ${st.blind ? 'checked' : ''}> Blind count — staff don't see expected numbers while counting</label>
    <label class="f">Match app count against ERP</label><select id="sE"><option value="lbl" ${st.erpBasis !== 'pcs' ? 'selected' : ''}>Labels (Lbl)</option><option value="pcs" ${st.erpBasis === 'pcs' ? 'selected' : ''}>Pieces (Pc)</option></select>
    <label class="f">App item type → ERP ornament (one per line, e.g. Ring = G-Ring)</label><textarea id="sM" style="min-height:150px">${esc(Object.entries(st.erpItemMap || {}).map(([a, b]) => `${a} = ${b}`).join('\n'))}</textarea>
    <label class="f">Category → ERP ornament (overrides item type; use - for "not in this ERP report")</label><textarea id="sCM">${esc(Object.entries(st.erpCatMap || {}).map(([a, b]) => `${a} = ${b}`).join('\n'))}</textarea>
    <label class="f">Main locations (comma separated)</label><input type="text" id="sAr" value="${esc(st.areas.join(', '))}">
    <label class="f">Sub displays</label><input type="text" id="sSd" value="${esc(st.subDisplays.join(', '))}">
    <label class="f">ERP ornament for Platinum</label><input type="text" id="sPt" value="${esc(st.erpPlatinum || 'YFJ - PLATINUM MM')}">
    <label class="f">ERP ornament for Tanih - CVD Jewellery</label><input type="text" id="sTn" value="${esc(st.erpTanih || 'Tanih - CVD Jewellery')}">
    <label class="f">ERP ornament for Silver</label><input type="text" id="sAg" value="${esc(st.erpSilver || 'Silver Jewellery')}">
    <label class="f">Discrepancy reasons (comma separated)</label><textarea id="sR">${esc(st.reasons.join(', '))}</textarea>
    <label class="f">Item types (comma separated)</label><textarea id="sI">${esc(st.itemTypes.join(', '))}</textarea>
    <label class="f">Purities</label><input type="text" id="sP" value="${esc(st.purities.join(', '))}">
    <label class="f">Categories</label><input type="text" id="sC" value="${esc(st.categories.join(', '))}">
    <button class="btn" style="width:100%;margin-top:14px" id="sS">Save settings</button></div>`;
  const list = (v) => v.split(',').map((x) => x.trim()).filter(Boolean);
  const kv = (v) => Object.fromEntries(v.split('\n').map((x) => x.split('=').map((y) => y.trim())).filter((x) => x[0] && x.length > 1));
  $('#sS').onclick = async () => { try { await api('settings', { settings: { shopName: $('#sN').value, waNumber: $('#sW').value, wtTol: +$('#sT').value, blind: $('#sB').checked, reqPhotos: $('#sPh').checked, erpBasis: $('#sE').value, areas: list($('#sAr').value), subDisplays: list($('#sSd').value), erpPlatinum: $('#sPt').value, erpTanih: $('#sTn').value, erpSilver: $('#sAg').value, erpItemMap: kv($('#sM').value), erpCatMap: kv($('#sCM').value), reasons: list($('#sR').value), itemTypes: list($('#sI').value), purities: list($('#sP').value), categories: list($('#sC').value) } }); toast('Settings saved'); load(true); } catch (e) { fail(e); } };
}

// ---------------- boot ----------------
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
// v1.17 splash: shown on every app start while data loads (at least ~1.2 s)
(function boot() {
  const sp = document.createElement('div'); sp.className = 'splash'; sp.innerHTML = '<div class="in"><div class="w">YAMIE</div><div class="c">CORE</div><div class="ln"></div></div><div class="m">STOCK · CASH</div>';
  document.body.appendChild(sp); const t0 = Date.now();
  const done = () => setTimeout(() => { sp.classList.add('out'); setTimeout(() => sp.remove(), 600); }, Math.max(0, 1200 - (Date.now() - t0)));
  (S.token ? load().then(() => { if (!S.D) showLogin(); }) : Promise.resolve(showLogin())).catch(() => showLogin()).finally(done);
})();
</script>
