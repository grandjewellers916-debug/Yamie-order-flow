:root{--wine:#78213f;--deep:#501329;--blush:#f8ebf0;--ink:#251f23;--muted:#83767d;--line:#e9e2e5;--bg:#f8f7f7;--ok:#287b56;--warn:#a0701d;--bad:#b3261e;--blue:#2d5d8a;--gold:#b0852f}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:#e9e6e8;color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}[hidden]{display:none!important}
.app{width:min(100%,460px);margin:auto;min-height:100dvh;background:var(--bg);box-shadow:0 0 35px #35212a15;padding-bottom:96px;position:relative}
.top{background:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .lg{display:flex;align-items:center;gap:10px}.top .lg img{height:30px}.top .lg b{font:700 11px Arial,sans-serif;letter-spacing:2px;color:#947983;display:block}
.top .lg span{font:800 16px Georgia,serif;color:var(--deep);letter-spacing:.5px}
.topR{display:flex;gap:6px;align-items:center}
.iconBtn{background:#faf3f6;border:0;border-radius:11px;color:var(--wine);font-weight:800;padding:9px 11px;font-size:12px;position:relative}
.iconBtn em{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;font-style:normal;font-size:9.5px;border-radius:9px;padding:1px 5px}
.syncDot.ok{color:var(--ok)}.syncDot.off{color:var(--bad)}.syncDot.wait{color:var(--warn)}
.main{padding:16px}.view{display:none}.view.active{display:block}
.kicker{color:var(--wine);font-size:10px;letter-spacing:1.8px;font-weight:850;text-transform:uppercase;margin:0 0 6px}
.h1{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.15;margin:0 0 6px}.sub{font-size:12px;line-height:1.55;color:var(--muted);margin:0 0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}
.card h3{font-size:14px;margin:0 0 12px;display:flex;gap:9px;align-items:center;justify-content:space-between}
.badge{background:var(--blush);color:var(--wine);font-size:10px;padding:5px 8px;border-radius:7px;font-weight:800}
.field{margin-bottom:12px}.field:last-child{margin-bottom:0}.field label{display:block;color:#675a62;font-weight:730;font-size:11px;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid #e4dde0;border-radius:11px;background:#fff;color:#30252b;padding:11px 12px;outline-color:#a46881;font-size:15px;min-height:44px}
.field textarea{min-height:66px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hint{font-size:11px;line-height:1.5;color:var(--muted);margin:5px 0 0}.req{color:var(--wine);font-style:normal}
.chip{border:1px solid #e6dce1;background:#fff;color:#594951;border-radius:10px;padding:9px 11px;font-weight:650;font-size:12px;white-space:nowrap}
.chip.active{color:var(--wine);border-color:#b77e95;background:var(--blush)}.chip em{font-style:normal;color:var(--muted);margin-left:4px}

  c.items = c.items.filter((x) => x.name).map((x) => ({ name: x.name, sizes: x.sizes || [], models: gSortM((x.models || []).filter((m) => m.name)).map((m) => ({ name: m.name, img: m.img || "", vendors: (m.vendors || []).filter(Boolean) })) }));
  if (!c.purities.some((p) => p.std) && c.purities[0]) c.purities[0].std = true;
  try {
    await api("grand/cfg", { grand: c });
    S.grand = c;
    toast("Grand lists saved");
  } catch (e) {
    toast(e.message);
  }
}
;
document.querySelectorAll("[data-logo]").forEach((i) => {
  i.src = LOGO[i.dataset.logo];
});
$("phCam").addEventListener("change", onPhotoPicked);
$("phGal").addEventListener("change", onPhotoPicked);
$("bkFile").addEventListener("change", bkPick);
const deskMQ = window.matchMedia("(min-width:1024px) and (pointer:fine)");
function applyDesk() {
  document.body.classList.toggle("desk", deskMQ.matches);
  if (me) go(cur.view);
}
applyDesk();
deskMQ.addEventListener ? deskMQ.addEventListener("change", applyDesk) : deskMQ.addListener(applyDesk);
document.addEventListener("keydown", (e) => {
  if (!me || e.target.matches("input,textarea,select")) return;
  if (e.key === "n" && can("enquiry")) {
    e.preventDefault();
    newEnquiry();
  }
  if (e.key === "/") {
    e.preventDefault();
    go("vOrders");
    setTimeout(() => $("q") && $("q").focus(), 50);
  }
  if (e.key === "Escape" && $("sheetBg").classList.contains("on")) closeSheet();
});
function takeNewQuery(q) {
  const id = new URLSearchParams(q || "").get("o");
  if (!id) return;
  if (!me) {
    pendingOpen = id;
    return;
  }
  pullChanges().then(() => {
    if (orders.find((o) => o.id === id)) openOrder(id);
    else {
      pendingOpen = id;
      toast("Opening the enquiry from Price Check…");
    }
  });
}
window.onNativeNew = function(q) {
  takeNewQuery(q);
  return true;
};
if (/^\/new/.test(location.pathname)) {
  takeNewQuery(location.search);
  try {
    history.replaceState(null, "", "/");
  } catch (e) {
  }
}
(function boot() {
  try {
    const appV = NATIVE && NATIVE.version ? NATIVE.version() : "";
    $("lockVer").textContent = appV ? "App v" + appV : "Web v" + APP_VERSION;
  } catch (e) {
  }
  showVersion();
  api("ping").then((d) => {
    serverVer = d.ver || "1.7";
    showVersion();
  }).catch(() => {
  });
  if (!token) return showLock();
  api("changes?since=" + (lastPull || 0) + "&cfgv=" + encodeURIComponent(cfgv)).then(async (d) => {
    me = d.me;
    if (!lastPull || (d.resetAt || "") !== resetAt) await pullAll();
    else {
      d.orders.forEach(mergeOrder);
      d.deleted.forEach((id) => {
        orders = orders.filter((o) => o.id !== id);
      });
      if (d.users) applyCfg(d);
      lastPull = d.now;
      sortOrders();
      cacheLocal();
      setNet(true);
    }
    if (me.mustChange) {
      $("lock").hidden = false;
      return firstSetup();
    }
    startSession();
  }).catch((e) => {
    if (isNet(e) && load("yod_me", null)) {
      me = load("yod_me", null);
      setNet(false);
      startSession();
    } else showLock();
  });
})();
window.addEventListener("beforeunload", () => {
  if (me) store("yod_me", me);
});
</script>
