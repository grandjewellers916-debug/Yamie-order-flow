<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8F171B">
<title>Yamie Stock Check</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--m:#8F171B;--m2:#6E1014;--m3:#F4E7E5;--iv:#FBF9F6;--cr:#F3EEE6;--ink:#1D1714;--mut:#776B63;--ln:#E6DED4;--ok:#1E7A46;--okb:#E3F3E9;--bad:#B3261E;--badb:#FBE6E4;--warn:#9A6200;--warnb:#FFF2D9;--pend:#8A8178;--pendb:#EFEBE6;--r:12px}
*{box-sizing:border-box}html,body{margin:0;background:var(--iv);color:var(--ink);font:15px/1.4 Jost,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;margin:0;font-weight:700;letter-spacing:.2px}
h1{font-size:26px}h2{font-size:22px}h3{font-size:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;background:var(--m);color:#fff;font-weight:600;min-height:44px}
.btn.sec{background:#fff;color:var(--m);border:1.5px solid var(--m)}
.btn.ghost{background:var(--cr);color:var(--ink)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}.wrap{flex-wrap:wrap}.grow{flex:1}.sp{justify-content:space-between}
.mut{color:var(--mut)}.sm{font-size:13px}.b{font-weight:600}.num{font-variant-numeric:tabular-nums}
.card{background:#fff;border:1px solid var(--ln);border-radius:var(--r);padding:14px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--cr);color:var(--ink);white-space:nowrap}
.chip.m{background:var(--m3);color:var(--m)}
.st{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.st.ok{background:var(--okb);color:var(--ok)}.st.var{background:var(--badb);color:var(--bad)}.st.stale{background:var(--warnb);color:var(--warn)}.st.pending{background:var(--pendb);color:var(--pend)}
input[type=text],input[type=number],input[type=search],input[type=tel],input[type=password],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:#fff;min-height:44px}
textarea{min-height:70px}
label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
/* layout */
#app{min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:var(--m);color:#fff;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.top .logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;line-height:1}
.top .logo small{display:block;font-family:Jost;font-size:11px;font-weight:400;opacity:.8;letter-spacing:1.5px;text-transform:uppercase}
.top .date{background:rgba(255,255,255,.14);border-radius:8px;padding:6px 10px;font-size:13px}
.bell{position:relative;width:40px;height:40px;border-radius:10px;color:#fff;display:grid;place-items:center}
.bell i{position:absolute;top:3px;right:3px;background:#FFD27A;color:var(--m2);font-style:normal;font-size:11px;font-weight:700;border-radius:99px;padding:0 5px;min-width:18px;text-align:center}
main{padding:14px;padding-bottom:96px;max-width:1300px;margin:0 auto}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom)}
/* Phone app shell (< 900 px, browser and Android app): top bar · scrolling content · bottom bar.
   The bottom bar is part of the layout (not floating), so it is always on screen; nothing can be swiped sideways. */
@media(max-width:899px){
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-y;max-width:100vw}
  #app{height:var(--vh,100dvh);min-height:0;display:flex;flex-direction:column;overflow:hidden}
  #app>.top{position:relative;flex:none}
  #app>main{flex:1 1 auto;min-height:0;width:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding-bottom:24px}
  #app>.nav{position:relative;flex:none;order:3;z-index:20}
  #app>.login{height:100%;overflow-y:auto}
  .tw{max-width:100%;touch-action:pan-x pan-y}
  .filters,.steps,.tabs{touch-action:pan-x pan-y}
  img,svg,table{max-width:100%}
}
.nav button{flex:1;padding:8px 2px 9px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--m);font-weight:600}
.banner{background:var(--warnb);color:var(--warn);padding:10px 14px;border-radius:10px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media(min-width:900px){
  .nav{top:0;bottom:0;right:auto;width:200px;flex-direction:column;border-top:0;border-right:1px solid var(--ln);padding-top:76px;gap:2px}
  .nav button{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:12px 20px;justify-content:flex-start}
  .nav button.on{background:var(--m3)}
  main{margin-left:200px;padding:22px 28px 110px;max-width:none}
  .top{z-index:30}
}
/* home */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--ln);border-radius:var(--r);padding:12px 14px}
.kpi .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.secs{display:grid;gap:12px;margin-top:14px}
@media(min-width:700px){.secs{grid-template-columns:repeat(3,1fr)}}
.seccard{cursor:pointer;text-align:left;width:100%}
.bar{height:8px;border-radius:99px;background:var(--pendb);overflow:hidden;display:flex;margin:10px 0 8px}
.bar span{display:block;height:100%}
.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media(min-width:700px){.acts{grid-template-columns:repeat(4,1fr)}}
/* list */
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.filters button{padding:7px 12px;border-radius:99px;background:#fff;border:1px solid var(--ln);white-space:nowrap;font-size:14px}
.filters button.on{background:var(--m);border-color:var(--m);color:#fff}
.grp{margin:16px 0 8px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;font-weight:600;display:flex;justify-content:space-between}
.locs{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}.locs>.loc{min-width:0}
.vtx{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;min-width:0;flex:1}
@media(min-width:700px){.locs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1150px){.locs{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(min-width:1800px){.locs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.loc{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--ln);border-radius:var(--r);padding:10px;text-align:left;width:100%}
.loc.var{border-color:#E9B5B0}.loc.ok{border-color:#B8DDC6}
.th{width:56px;height:56px;border-radius:9px;background:var(--cr);flex:none;display:grid;place-items:center;overflow:hidden;color:var(--m)}
.th img{width:100%;height:100%;object-fit:cover}
.loc .nm{font-weight:600}.loc .meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.loc .q{text-align:right;flex:none}
.loc .q .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.sticky{position:fixed;left:0;right:0;bottom:62px;padding:10px 14px;background:linear-gradient(transparent,var(--iv) 30%);z-index:15}
@media(min-width:900px){.sticky{left:200px;bottom:0}}
/* tables */
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--ln);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:600;background:var(--cr)}
tr.tot td{font-weight:700;background:var(--m3)}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:var(--r);background:#fff}
td.pos{color:var(--ok);font-weight:600}td.neg{color:var(--bad);font-weight:600}
/* modal */
.ov{position:fixed;inset:0;background:rgba(29,23,20,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--iv);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:0 0 calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){.ov{align-items:center}.md{border-radius:18px;max-height:90vh}}
.mh{position:sticky;top:0;background:var(--iv);padding:14px 16px 10px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--ln);z-index:2}
.mb{padding:14px 16px}
.md.wide{max-width:940px}
.x{width:36px;height:36px;border-radius:10px;background:var(--cr);font-size:20px;flex:none}
.photos{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.photos .ph{position:relative;flex:none}
.photos img{height:120px;border-radius:10px;display:block;cursor:zoom-in}
.photos .lbl{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:1px 7px;border-radius:99px}
.photos .del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;width:24px;height:24px}
.addph{height:120px;width:110px;border:1.5px dashed var(--m);border-radius:10px;color:var(--m);display:grid;place-items:center;text-align:center;font-size:13px;flex:none}
.cnt{width:100%;border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;background:#fff}
.cnt .r{display:grid;grid-template-columns:1fr 60px 132px 54px;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--ln)}
.cnt .r:last-child{border-bottom:0}
.cnt .r.h{background:var(--cr);font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.step{display:flex;align-items:center;border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.step button{width:40px;height:42px;font-size:20px;background:var(--cr)}
.step input{border:0;border-radius:0;text-align:center;min-height:42px;padding:4px;width:52px;-moz-appearance:textfield}
.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.seg{display:flex;background:var(--cr);border-radius:10px;padding:3px}
.seg button{flex:1;padding:8px;border-radius:8px;font-weight:500}
.seg button.on{background:#fff;color:var(--m);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:70;display:grid;place-items:center}
.lb img{max-width:96vw;max-height:90vh}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:90;max-width:90vw;text-align:center}
.al{display:flex;gap:10px;padding:12px;border-bottom:1px solid var(--ln);background:#fff}
.al.new{background:#FFFBF0}
.al .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:700}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--m) 0%,var(--m2) 100%)}
.lbox{background:var(--iv);border-radius:20px;padding:24px;width:100%;max-width:400px;text-align:center}
.users{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.users button{padding:12px 4px;border-radius:12px;background:#fff;border:1px solid var(--ln)}
.users button.on{border-color:var(--m);background:var(--m3);color:var(--m);font-weight:600}
.users .av{width:40px;height:40px;border-radius:99px;background:var(--m);color:#fff;display:grid;place-items:center;margin:0 auto 4px;font-weight:600}
.dots{display:flex;gap:12px;justify-content:center;margin:14px 0}
.dots i{width:14px;height:14px;border-radius:99px;border:2px solid var(--m)}
.dots i.f{background:var(--m)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:56px;border-radius:12px;background:#fff;border:1px solid var(--ln);font-size:22px;font-weight:500}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);margin-bottom:14px;overflow-x:auto}
.tabs button{padding:10px 14px;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button.on{border-color:var(--m);color:var(--m);font-weight:600}
.list>*{border-bottom:1px solid var(--ln)}
.li{display:flex;gap:10px;align-items:center;padding:10px 12px;background:#fff}
.chk{display:flex;gap:8px;align-items:center;padding:6px 0}
.chk input{width:20px;height:20px;accent-color:var(--m)}
/* v1.1 count flow */
.iti{width:40px;height:40px;border-radius:10px;background:#FBF1E4;display:grid;place-items:center;flex:none}
.hico{width:46px;height:46px;border-radius:12px;background:var(--m3);color:var(--m);display:grid;place-items:center;flex:none}
.who{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:6px 10px;text-align:left;line-height:1.15;flex:none}
.ctiles{display:flex;gap:10px;align-items:stretch;margin-top:4px}
.photos.mini{flex:none;max-width:40%}.photos.mini img{height:96px}.photos.mini .addph{height:96px;width:96px;font-size:12px}
.kpis.tiles{flex:1;grid-template-columns:repeat(4,1fr);gap:8px}
.kpis.tiles .kpi{padding:10px}.kpi small{font-size:13px;font-weight:500}
.kpi.okt{background:var(--okb);border-color:#BFE0CB}.kpi.badt{background:var(--badb);border-color:#EFC4BF}.kpi.op{border-color:#E4B9B3}
.chip.mm{background:var(--m);color:#fff}
.steps{display:flex;border-bottom:1px solid var(--ln);margin:6px 0 12px;overflow-x:auto}
.steps button{flex:1;display:flex;gap:8px;align-items:center;justify-content:center;padding:10px 6px;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500;color:var(--ink)}
.steps button i{font-style:normal;width:26px;height:26px;border-radius:99px;border:1.5px solid var(--mut);display:grid;place-items:center;font-size:13px}
.steps button.on{color:var(--m);border-color:var(--m);font-weight:600}.steps button.on i{background:var(--m);border-color:var(--m);color:#fff}
.steps button.past i{background:var(--ok);border-color:var(--ok);color:#fff}
.steps button:disabled{opacity:.7;cursor:default}
.info{background:var(--cr);border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:10px}
.vt{border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;background:#fff}
.vr{display:grid;grid-template-columns:44px minmax(0,1fr) 70px 190px 110px;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--ln)}
.vr.h{border-top:0;background:var(--cr);font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.vr.add{grid-template-columns:1fr}.vr .c{text-align:center}.vr .big{font-size:20px;font-weight:600}
.yn{display:flex;gap:6px;justify-content:center}
.yn button{flex:1;padding:8px 6px;border-radius:99px;border:1.5px solid;font-weight:600;min-height:40px}
.yn .yes{border-color:#7DBB95;color:var(--ok)}.yn .yes.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.yn .no{border-color:#E4AAA4;color:var(--bad)}.yn .no.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.vsub{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;background:#FDF0EE;margin:0 10px 10px;padding:10px 12px;border-radius:10px}
.vsub select{min-width:180px}
.dbadge{display:inline-block;padding:6px 12px;border-radius:10px;font-weight:700;font-size:16px;margin-top:4px}
.dbadge.neg{background:var(--badb);color:var(--bad)}.dbadge.pos{background:var(--warnb);color:var(--warn)}.dbadge.zero,.dbadge.okb{background:var(--okb);color:var(--ok)}
.foot{position:sticky;bottom:-16px;background:var(--iv);border-top:1px solid var(--ln);margin:14px -16px -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.foot .btn{min-height:48px}
.sstrip{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);gap:8px}
.done-b{background:var(--okb);color:var(--ok);font-weight:600;padding:10px 14px;border-radius:10px;margin-bottom:12px}
.wbox{background:#FDF6F4;border:1px solid #F0D9D5;border-radius:var(--r);padding:12px}
.formula{background:#fff;border:1px solid var(--ln);border-radius:99px;padding:6px 14px;text-align:center;margin:10px auto;font-weight:500;color:var(--m);max-width:420px}
.wgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.wc{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:8px;text-align:center}
.wc.lock{background:#FBF1E4}.wc .wv{font-size:17px;font-weight:600;margin-top:6px}
.wc .step{justify-content:center;margin-top:4px}.wc .step button{width:32px}
.vr.sl{grid-template-columns:44px 1fr 120px 150px 90px}.vr.tot{background:var(--m3)}
.pill{display:inline-block;min-width:56px;padding:6px 10px;border-radius:9px;background:var(--cr);font-weight:600;font-size:18px}.pill.ok{background:var(--okb);color:var(--ok)}
.step.sm2 button{width:34px}.step.sm2 input{width:44px}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.fs{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:10px;font-size:13px;cursor:default}
.fs[data-flow]{cursor:pointer}.fs i{font-style:normal;font-size:20px;width:36px;height:36px;border-radius:10px;background:var(--cr);display:grid;place-items:center;flex:none}
.fs b{display:block;font-size:14px}.fs span{color:var(--mut)}
.fs.done{border-color:#B8DDC6;background:var(--okb)}.fs.done i{background:#fff}
.fs.cur{border-color:var(--m);box-shadow:0 0 0 2px var(--m3)}.fs.cur i{background:var(--m);color:#fff}
@media(max-width:699px){.flow{grid-template-columns:1fr 1fr}}
.eg{display:grid;grid-template-columns:150px 92px minmax(150px,1.4fr) 112px 78px 64px 84px 84px minmax(90px,1fr) 32px;gap:8px;align-items:start;padding:6px 0;border-bottom:1px solid var(--ln)}
.eg.h{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:600;padding-top:0}
.eg select,.eg input{min-height:40px;padding:6px 8px;font-size:14px}.eg .x{width:32px;height:40px}
.eg .c{text-align:center}.oc{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:40px;border-radius:9px;background:var(--cr);font-size:12px;line-height:1.25;padding:3px}
.oc b{font-size:16px}.oc.cl{background:var(--okb);color:var(--ok)}.oc.cl.neg{background:var(--badb);color:var(--bad)}
.oc.cl .mut:empty{display:none}
select.tin{border-color:#9FD0B2;background:#F3FBF6}select.tout{border-color:#E8B4AE;background:#FDF5F4}
.egn{display:none}
@media(max-width:1099px){.eg.h{display:none}.eg{grid-template-columns:1fr 1fr;grid-template-areas:"n x" "ty se" "lo lo" "it it" "qt wt" "op cl" "rf rf";padding:12px 0}
  .egn{display:block;grid-area:n;align-self:center;font-weight:600;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
  .eg>[data-f=type]{grid-area:ty}.eg>[data-f=sec]{grid-area:se}.eg>[data-f=locId]{grid-area:lo}.eg>[data-f=item]{grid-area:it}.eg>[data-f=qty]{grid-area:qt}.eg>[data-f=wt]{grid-area:wt}.eg>[data-op]{grid-area:op}.eg>[data-cl]{grid-area:cl}.eg>[data-f=ref]{grid-area:rf}.eg .x{grid-area:x;justify-self:end}

<body>
<div id="app"></div>
<script type="module">
import { SECTIONS, PERMS, ROLE_PERMS, REASONS, TXN_TYPES, metalOf, erpMetal, JTYPES, LINE_JTYPES, JT_SHORT, itemOf, jtOfLine, purOfLine, defaultPur, lineKey, keyText, defaultJt, roundOf, roundCounts, summarize, sumLines, r3, locStatus, istDate, erpCompare, erpKey } from './core.mjs';

const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => (+n || 0).toLocaleString('en-IN');

const tm = (t) => new Date(t).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
const dt = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const ago = (t) => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : new Date(t).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) + ' ' + tm(t); };
const STLBL = { pending: 'Not checked', ok: 'Verified', var: 'Discrepancy', stale: 'Recount' };
const VERSION = '1.11';
const ICON = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  counter: '<rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/>',
  tray: '<path d="M3 8h18l-2 10H5z"/><path d="M8 8V5h8v3"/>',
  box: '<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
  total: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  more: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  bell: '<path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-6.5 8-6.5s7 2 8 6.5"/>',
  cam: '<path d="M4 7h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13" r="3.5"/>',

const svg = (k, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;

if (/YamieStockCheckApp/.test(navigator.userAgent) || window.YamieStock) document.documentElement.classList.add('apk');
// real visible height (older Android WebViews get 100vh wrong)
const setVh = () => document.documentElement.style.setProperty('--vh', window.innerHeight + 'px');
setVh(); addEventListener('resize', setVh); addEventListener('orientationchange', () => setTimeout(setVh, 300));
const S = { token: localStorage.ysc_token || '', me: null, D: null, view: 'home', date: null, filter: 'all', q: '', tab: 'users', modal: false, sumCache: null };
const can = (p) => S.me && (S.me.role === 'admin' || (S.me.perms || []).includes(p));
const isToday = () => S.D && S.D.date === S.D.today;
const editable = () => isToday() && S.D.day.status !== 'closed';

async function api(path, body) {
  const r = await fetch('/api/' + path, { method: body ? 'POST' : 'GET', headers: { 'content-type': 'application/json', ...(S.token ? { authorization: 'Bearer ' + S.token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({ error: 'Network error' }));
  if (r.status === 401 && path !== 'login') { logout(); throw new Error(j.error || 'Please log in'); }
  if (!r.ok) throw new Error(j.error || 'Error ' + r.status);
  return j;
}
function toast(msg, ms = 2600) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
const fail = (e) => toast('⚠ ' + e.message, 4000);
const img = (key) => `/api/img/${key}?t=${encodeURIComponent(S.token)}`;

// ---------------- login ----------------
let LG = { users: [], sel: null, pin: '' };
async function showLogin() {
  S.me = null; document.title = 'Yamie Stock Check';
  try { const j = await api('login-list'); LG.users = j.users; } catch (e) { LG.users = []; }
  LG.sel = localStorage.ysc_last && LG.users.find((u) => u.id === localStorage.ysc_last) ? localStorage.ysc_last : null; LG.pin = '';
  renderLogin();
}
function renderLogin() {
  $('#app').innerHTML = `<div class="login"><div class="lbox">
    <div style="color:var(--m)">${svg('box', 34)}</div>
    <h1 style="color:var(--m)">Yamie Stock Check</h1><div class="mut sm">Counter · Buffer tray · Box stock</div>
    <div class="users">${LG.users.map((u) => `<button data-u="${esc(u.id)}" class="${LG.sel === u.id ? 'on' : ''}"><div class="av">${esc(u.name[0] || '?')}</div><div class="sm">${esc(u.name)}</div><div class="mut" style="font-size:11px">${esc(u.role)}</div></button>`).join('') || '<div class="mut">Cannot reach server</div>'}</div>
    <div class="${LG.sel ? '' : 'hidden'}"><div class="mut sm">Enter PIN</div><div class="dots">${Array.from({ length: Math.max(4, LG.pin.length) }, (_, i) => `<i class="${i < LG.pin.length ? 'f' : ''}"></i>`).join('')}</div>
    <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '⌫', 0, '→'].map((k) => `<button data-k="${k}" ${k === '→' ? 'style="background:var(--m);color:#fff"' : ''}>${k}</button>`).join('')}</div></div>
  </div></div>`;
  $('#app').querySelectorAll('[data-u]').forEach((b) => b.onclick = () => { LG.sel = b.dataset.u; LG.pin = ''; renderLogin(); });
  $('#app').querySelectorAll('[data-k]').forEach((b) => b.onclick = () => padKey(b.dataset.k));
}
async function padKey(k) {
  if (k === '⌫') LG.pin = LG.pin.slice(0, -1);
  else if (k === '→') return doLogin();
  else if (LG.pin.length < 6) LG.pin += k;
  renderLogin();
}
async function doLogin() {
  if (LG.pin.length < 4) return toast('Enter your PIN');
  try {
    const j = await api('login', { userId: LG.sel, pin: LG.pin });
    S.token = j.token; localStorage.ysc_token = j.token; localStorage.ysc_last = LG.sel; S.me = j.user; S.view = 'home';
    await load();
  } catch (e) { LG.pin = ''; renderLogin(); fail(e); }
}
document.addEventListener('keydown', (e) => { if (S.me || !LG.sel) return; if (/^\d$/.test(e.key)) padKey(e.key); else if (e.key === 'Backspace') padKey('⌫'); else if (e.key === 'Enter') padKey('→'); });
function logout() { S.token = ''; localStorage.removeItem('ysc_token'); S.me = null; showLogin(); }

// ---------------- data ----------------
async function load(quiet) {
  try {
    const j = await api('state' + (S.date ? '?date=' + S.date : ''));
    const prevUnread = S.D?.alerts?.unread || 0;
    S.D = j; S.me = j.me; S.date = j.date === j.today ? null : j.date;
    S.round = roundOf(j.day);
    S.sum = summarize(j.locs, j.day.opening, j.mvs, roundCounts(j.counts, S.round), j.settings);
    const mT = S.round === 'morning' ? S.sum.total : summarize(j.locs, j.day.opening, j.mvs, roundCounts(j.counts, 'morning'), j.settings).total;
    S.rounds = { morning: { done: mT.locs - mT.pending, locs: mT.locs }, evening: S.round === 'evening' ? { done: S.sum.total.locs - S.sum.total.pending - S.sum.total.stale, locs: S.sum.total.locs } : { done: 0, locs: mT.locs } };
    S.eodCount = j.mvs.filter((m) => m.eod && !m.void).length;
    S.locById = Object.fromEntries(j.locs.map((l) => [l.id, l]));
    if (quiet && j.alerts.unread > prevUnread) notify(j.alerts.unread - prevUnread);
    if (!quiet || !S.modal) render();
    else renderTop();
  } catch (e) { if (S.token) fail(e); }
}
function notify(n) {
  if (localStorage.ysc_notify === '1' && 'Notification' in window && Notification.permission === 'granted') {
    try { new Notification('Yamie Stock Check', { body: `${n} new stock alert${n > 1 ? 's' : ''}`, icon: 'icon.svg' }); } catch {}
  } else toast(`🔔 ${n} new alert${n > 1 ? 's' : ''}`);
}
setInterval(() => { if (S.me && document.visibilityState === 'visible' && !S.modal) load(true); }, 40000);
document.addEventListener('visibilitychange', () => { if (S.me && document.visibilityState === 'visible' && !S.modal) load(true); });

const activeLocs = (sec) => S.D.locs.filter((l) => (l.active !== false || sumLines(S.sum.exp[l.id]?.lines)) && (!sec || l.sec === sec)).sort((a, b) => (a.order || 0) - (b.order || 0));
const expOf = (id) => S.sum.exp[id] || { lines: {}, wt: 0 };
const opOf = (id) => S.D.day.opening[id] || { lines: {}, wt: 0 };
const hideExp = () => S.D.settings.blind && !can('setup') && !can('move');
const secLabel = (k) => SECTIONS.find((s) => s.key === k)?.label || k;
const uname = (id) => S.D.userNames[id] || id;
const kT = (k, loc) => (loc || String(k).includes('@') ? keyText(loc, k) : k);
const jtB = (jt) => `<span class="jtb ${{ 'Plain Gold Jewellery': 'g', 'Diamond Jewellery': 'd', Platinum: 'p' }[jt] || 'g'}">${JT_SHORT[jt] || 'Gold'}</span>`;
const kL = (loc, k) => { const p = purOfLine(loc, k); return `${jtB(jtOfLine(loc, k))}${p ? `<span class="pub">${esc(p)}</span>` : ''}<span class="b">${esc(itemOf(k))}</span>`; };
const linesTxt = (l, loc) => Object.entries(l || {}).filter(([, n]) => n).map(([t, n]) => `${kT(t, loc)} ${fmt(n)}`).join(', ') || '—';

// ---------------- shell ----------------
const NAV = [['home', 'Home', 'home'], ['counter', 'Counter', 'counter'], ['tray', 'Trays', 'tray'], ['box', 'Boxes', 'box'], ['total', 'Consolidated', 'total'], ['more', 'More', 'more']];
function render() {
  if (!S.me) return showLogin();

  $('#app').innerHTML = `<header class="top" id="top"></header><main id="main"></main><nav class="nav">${NAV.map(([k, l, i]) => `<button data-nav="${k}" class="${S.view === k || (k === 'more' && ['more', 'alerts', 'log', 'admin', 'history', 'eod'].includes(S.view)) ? 'on' : ''}">${svg(i)}<span>${l === 'Consolidated' && innerWidth < 900 ? 'Total' : l}</span></button>`).join('')}</nav>`;

  v();
}
function renderTop() {
  const t = $('#top'); if (!t) return;
  const d = S.D;
  t.innerHTML = `<div class="logo grow">Yamie<small>Stock Check</small></div>
    <button class="date" id="dateBtn">${isToday() ? 'Today' : '📅'} ${new Date(d.date + 'T00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short' })} · ${d.day.status === 'closed' ? 'Closed' : 'Open'}</button>
    ${can('alerts') ? `<button class="bell" id="bellBtn" title="Alerts">${svg('bell')}${d.alerts.unread ? `<i>${d.alerts.unread}</i>` : ''}</button>` : ''}`;

  $('#bellBtn') && ($('#bellBtn').onclick = () => go('alerts'));

function go(v) { S.view = v; S.filter = 'all'; S.q = ''; if (v === 'total') S.tab = ''; render(); scrollTo(0, 0); $('#main')?.scrollTo(0, 0); }
function viewBanner() {
  if (isToday()) return S.D.day.status === 'closed' ? `<div class="banner">Today is closed — stock is locked. ${S.me.role === 'admin' ? '<button class="btn sm sec" id="reopenBtn">Reopen today</button>' : ''}</div>` : '';

}
function bindBanner() {
  $('#backToday') && ($('#backToday').onclick = () => { S.date = null; load(); });

}

// ---------------- day flow: morning count → entries → evening count → close ----------------
function dayFlow() {
  const R = S.rounds; const ev = S.round === 'evening'; const closed = S.D.day.status === 'closed';
  const st = (done, cur) => done ? 'done' : cur ? 'cur' : '';
  const mDone = R.morning.done >= R.morning.locs, eDone = ev && R.evening.done >= R.evening.locs;
  return `<div class="flow">
    <div class="fs ${st(mDone, !ev)}"><i>☀</i><div><b>Morning count</b><span>${R.morning.done}/${R.morning.locs} verified</span></div></div>
    <div class="fs ${st(ev, mDone && !ev)}" data-flow="eod"><i>🧾</i><div><b>End-of-day entries</b><span>${S.eodCount} entr${S.eodCount === 1 ? 'y' : 'ies'}${ev ? ' · done' : ''}</span></div></div>
    <div class="fs ${st(eDone, ev && !eDone)}"><i>🌙</i><div><b>Evening count</b><span>${ev ? `${R.evening.done}/${R.evening.locs} verified` : 'after entries'}</span></div></div>
    <div class="fs ${st(closed, eDone && !closed)}" data-flow="close"><i>🔒</i><div><b>Close day</b><span>${closed ? 'closed' : 'both counts compulsory'}</span></div></div></div>`;
}

// ---------------- end-of-day entries ----------------
// Opening = today's opening at that location for the item; Closing = stock now ± this row (and earlier unsaved rows for the same location + item)
function eodCalc(rows, i) {
  const r = rows[i]; const l = S.locById[r.locId]; if (!l || !r.item) return null;

  const op = opOf(l.id).lines[r.item] || 0, opWt = box ? +(opOf(l.id).wt || 0) : 0;
  const now = expOf(l.id).lines[r.item] || 0, nowWt = box ? +(expOf(l.id).wt || 0) : 0;
  let before = now, beforeWt = nowWt;
  for (let j = 0; j < i; j++) { const x = rows[j]; if (x.locId !== r.locId) continue; const sg = (TXN_TYPES.find((t) => t.k === x.type)?.dir) || -1; if (x.item === r.item) before += sg * (+x.qty || 0); if (box && (nowWt > 0 || sg > 0)) beforeWt += sg * (+x.wt || 0); }
  const cl = before + sign * (+r.qty || 0); const clWt = r3(beforeWt + (box && (nowWt > 0 || sign > 0) ? sign * (+r.wt || 0) : 0));
  return { op, opWt, now, nowWt, cl, clWt, sign, chg: sign * (+r.qty || 0) };
}

function startPanel(scope) {

  const P = sessProgress(orderFor(scope)); const mine = (S.D.sessions || []).find((x) => x.by === S.me.id && x.scope === scope && !x.ids && (x.round || 'morning') === S.round && x.status === 'active');

async function shrink(file, max = 1280) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);

}

    $('#main').innerHTML = `<h1 style="margin-bottom:12px">History</h1><div class="tw"><table><tr><th>Date</th><th>Status</th><th>Opening</th><th>In</th><th>Out</th><th>Closing</th>${SECTIONS.map((s) => `<th>${s.short}</th>`).join('')}<th>Checked</th><th>Variance</th><th></th></tr>
    ${j.days.map((d) => { const m = d.summary; return `<tr><td class="b">${dt(d.date)}</td><td style="text-align:left">${d.status === 'closed' ? `<span class="st ok">Closed</span>${d.autoClosed ? ' <span class="mut sm">auto</span>' : ''}` : '<span class="st stale">Open</span>'}</td>
      ${m ? `<td>${fmt(m.opening)}</td><td>${fmt(m.in)}</td><td>${fmt(m.out)}</td><td class="b">${fmt(m.closing)}</td>${SECTIONS.map((s) => `<td>${fmt(m.sec?.[s.key]?.closing || 0)}</td>`).join('')}<td>${m.checked}/${m.locs}</td><td class="${m.variances ? 'neg' : 'pos'}">${m.variances}</td>` : `<td colspan="${6 + SECTIONS.length}" class="mut" style="text-align:center">In progress</td>`}
      <td><button class="btn sm ghost" data-day="${d.date}">View</button></td></tr>`; }).join('')}</table></div>`;
    $('#main').querySelectorAll('[data-day]').forEach((b) => b.onclick = async () => { S.date = b.dataset.day === S.D.today ? null : b.dataset.day; S.view = 'total'; await load(); });
  } catch (e) { fail(e); }
}
async function vAdmin() {
  const tabs = [['users', 'Users', can('users')], ['locs', 'Locations', can('setup')], ['settings', 'Settings', can('setup')], ['backup', 'Backup', S.me.role === 'admin']].filter((x) => x[2]);
  if (!tabs.find((t) => t[0] === S.tab)) S.tab = tabs[0]?.[0];
  $('#main').innerHTML = `<h1 style="margin-bottom:12px">Admin</h1><div class="tabs">${tabs.map(([k, t]) => `<button data-t="${k}" class="${S.tab === k ? 'on' : ''}">${t}</button>`).join('')}</div><div id="adm"></div>`;
  $('#main').querySelectorAll('[data-t]').forEach((b) => b.onclick = () => { S.tab = b.dataset.t; vAdmin(); });
  if (S.tab === 'users') admUsers(); else if (S.tab === 'locs') admLocs(); else if (S.tab === 'backup') admBackup(); else admSettings();
}
// ---------- database backup (admin) ----------
const kb = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
async function admBackup() {
  $('#adm').innerHTML = '<div class="mut" style="padding:20px">Loading…</div>';
  let j; try { j = await api('backup/keys'); } catch (e) { $('#adm').innerHTML = `<div class="card">${esc(e.message)}</div>`; return; }
  const days = j.data.filter((k) => k.startsWith('day/')).length; const L = j.last;
  $('#adm').innerHTML = `<div class="card">
    <h3>Database backup</h3>
    <div class="mut" style="margin:4px 0 12px">Downloads the whole shared database as one file: locations, items, users and roles, settings, every day's opening, entries, counts, count sessions, ERP data, alerts and history. Keep it on a computer or Google Drive.</div>
    <div class="kpis" style="margin-bottom:12px">
      <div class="kpi"><div class="l">Records</div><div class="v">${fmt(j.data.length)}</div></div>
      <div class="kpi"><div class="l">Days</div><div class="v">${fmt(days)}</div></div>
      <div class="kpi"><div class="l">Photos</div><div class="v">${fmt(j.images.length)}</div></div>
      <div class="kpi"><div class="l">Last backup</div><div class="v" style="font-size:15px">${L ? `${new Date(L.at).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}` : 'Never'}</div><div class="mut sm">${L ? `${esc(L.byName || '')} · ${kb(L.bytes)}${L.photos ? ' · with photos' : ''}` : ''}</div></div></div>
    <div class="row wrap"><button class="btn" id="bkData">⬇ Download backup</button><button class="btn sec" id="bkAll" ${j.images.length ? '' : 'disabled'}>⬇ Backup with photos (${fmt(j.images.length)})</button></div>
    <div id="bkProg" class="mut sm" style="margin-top:10px"></div>
    <div class="mut sm" style="margin-top:10px">File: <b>yamie-stock-backup-&lt;date&gt;.json</b>. PINs are stored as secure hashes, not readable PINs. Only admins can download a backup.</div></div>`;
  $('#bkData').onclick = () => runBackup(j, false);
  $('#bkAll').onclick = () => runBackup(j, true);
}
async function runBackup(j, photos) {
  const P = $('#bkProg'); const btns = [$('#bkData'), $('#bkAll')]; btns.forEach((b) => b && (b.disabled = true));
  try {
    const data = {}; const keys = j.data;
    for (let i = 0; i < keys.length; i += 300) { P.textContent = `Reading records ${Math.min(i + 300, keys.length)} / ${keys.length}…`; Object.assign(data, (await api('backup/get', { keys: keys.slice(i, i + 300) })).items); }
    const images = {};
    if (photos) {
      let n = 0;
      for (let i = 0; i < j.images.length; i += 6) {
        await Promise.all(j.images.slice(i, i + 6).map(async (k) => { try { const r = await fetch(img(k)); if (!r.ok) return; const b = await r.blob(); images[k] = await new Promise((ok) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(b); }); } catch {} }));
        n = Math.min(i + 6, j.images.length); P.textContent = `Reading photos ${n} / ${j.images.length}…`;
      }
    }
    const file = { app: 'Yamie Stock Check', format: 'yamie-stock-backup', formatVersion: 1, appVersion: VERSION, exportedAt: new Date().toISOString(), exportedBy: S.me.name, today: S.D?.date, counts: { records: Object.keys(data).length, photos: Object.keys(images).length }, data, images };
    const txt = JSON.stringify(file);
    const name = `yamie-stock-backup-${S.D?.date || new Date().toISOString().slice(0, 10)}${photos ? '-photos' : ''}.json`;
    if (window.YamieStock?.shareFile) window.YamieStock.shareFile(name, 'application/json', txt);
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
    await api('backup/done', { keys: Object.keys(data).length, images: Object.keys(images).length, bytes: txt.length, photos });
    toast(`✓ Backup ready — ${name} (${kb(txt.length)})`, 4000);
    admBackup();
  } catch (e) { fail(e); P.textContent = ''; btns.forEach((b) => b && (b.disabled = false)); }
}
async function admUsers() {
  const j = await api('users');
  $('#adm').innerHTML = `<div class="row sp" style="margin-bottom:10px"><div class="mut">Staff log in with name + PIN</div><button class="btn sm" id="uAdd">＋ Add user</button></div>
    <div class="card list" style="padding:0">${j.users.map((u) => `<button class="li" style="width:100%;text-align:left;${u.active ? '' : 'opacity:.5'}" data-u="${u.id}"><div class="grow"><div class="b">${esc(u.name)} <span class="chip m">${esc(u.role)}</span>${u.active ? '' : ' <span class="chip">disabled</span>'}</div><div class="mut sm">${(u.role === 'admin' ? Object.keys(PERMS) : u.perms).map((p) => PERMS[p]).join(' · ')}</div></div><span class="mut">›</span></button>`).join('')}</div>`;
  const edit = (u) => modal(u.id ? 'Edit user' : 'Add user', '', `<label class="f">Name</label><input type="text" id="uN" value="${esc(u.name || '')}">
    <label class="f">Role</label><select id="uR">${Object.keys(ROLE_PERMS).map((r) => `<option ${u.role === r ? 'selected' : ''}>${r}</option>`).join('')}</select>
    <label class="f">Permissions</label><div id="uP">${Object.entries(PERMS).map(([k, t]) => `<label class="chk"><input type="checkbox" value="${k}" ${(u.perms || ROLE_PERMS[u.role || 'staff']).includes(k) ? 'checked' : ''}> ${t}</label>`).join('')}</div>
    <label class="f">${u.id ? 'New PIN (leave blank to keep)' : 'PIN (4–6 digits)'}</label><input type="password" inputmode="numeric" id="uPin">
    ${u.id ? `<label class="chk"><input type="checkbox" id="uA" ${u.active !== false ? 'checked' : ''}> Active</label>` : ''}
    <button class="btn" style="width:100%;margin-top:14px" id="uS">Save</button>`, (ov) => {
    $('#uR').onchange = () => { const p = ROLE_PERMS[$('#uR').value]; ov.querySelectorAll('#uP input').forEach((c) => c.checked = p.includes(c.value)); };
    $('#uS').onclick = async () => { try { await api('users/save', { user: { id: u.id, name: $('#uN').value.trim(), role: $('#uR').value, perms: [...ov.querySelectorAll('#uP input:checked')].map((c) => c.value), active: $('#uA') ? $('#uA').checked : true }, pin: $('#uPin').value }); toast('Saved'); closeModal(); admUsers(); load(true); } catch (e) { fail(e); } };
  });
  $('#uAdd').onclick = () => edit({ role: 'staff' });
  $('#adm').querySelectorAll('[data-u]').forEach((b) => b.onclick = () => edit(j.users.find((u) => u.id === b.dataset.u)));
}
function admLocs() {
  const st = S.D.settings;
  $('#adm').innerHTML = `<div class="mut sm" style="margin-bottom:10px">Add, edit or delete counters, trays and boxes. Tap a name to open it (photos, stock). ${editable() ? '' : '<b>Day is closed — reopen to change stock.</b>'}</div>` + SECTIONS.map((s) => `<div class="grp"><span>${s.label} (${activeLocs(s.key).length})</span>${editable() ? `<button class="btn sm sec" data-add="${s.key}">＋ Add ${s.key === 'counter' ? 'counter tray' : s.key === 'tray' ? 'tray' : 'box'}</button>` : ''}</div>
    <div class="tw"><table><tr><th>Name</th>${s.key === 'counter' ? '<th>Main location</th><th>Sub display</th>' : '<th>Main location</th>'}<th>Group</th><th>Jewellery type</th><th>Purity</th><th>Item</th><th>Pcs</th>${s.key === 'box' ? '<th>Weight g</th>' : ''}<th></th></tr>${activeLocs(s.key).map((l) => `<tr><td class="b" data-loc="${l.id}" style="cursor:pointer;text-decoration:underline dotted">${esc(l.name)}${l.boxNo ? ` <span class="chip m">${esc(l.boxNo)}</span>` : ''}</td><td style="text-align:left">${esc(l.area || '—')}</td>${s.key === 'counter' ? `<td style="text-align:left">${esc(l.sub || '—')}</td>` : ''}<td style="text-align:left">${esc(l.group)}</td><td style="text-align:left"><span class="chip ${metalOf(l) === 'Platinum' ? 'pt' : l.jtype === 'Diamond Jewellery' ? 'dia' : 'au'}">${esc(l.jtype || '—')}</span></td><td style="text-align:left">${esc(l.purity || '—')}</td><td style="text-align:left">${esc(l.itemType || 'Mixed')}</td><td>${fmt(sumLines(expOf(l.id).lines))}</td>${s.key === 'box' ? `<td class="${expOf(l.id).wt ? '' : 'neg'}">${expOf(l.id).wt ? g3(expOf(l.id).wt) : 'not set'}</td>` : ''}
      <td style="white-space:nowrap">${can('setup') && editable() ? `<button class="btn sm ghost" data-edit="${l.id}">✎ Edit</button> <button class="btn sm ghost" data-delloc="${l.id}" style="color:var(--bad)">🗑</button>` : ''}</td></tr>`).join('')}</table></div>`).join('');
  $('#adm').querySelectorAll('[data-loc]').forEach((r) => r.onclick = () => locSheet(r.dataset.loc));
  $('#adm').querySelectorAll('[data-edit]').forEach((b) => b.onclick = () => locEdit(S.locById[b.dataset.edit]));
  $('#adm').querySelectorAll('[data-delloc]').forEach((b) => b.onclick = () => delLoc(S.locById[b.dataset.delloc]));
  $('#adm').querySelectorAll('[data-add]').forEach((b) => b.onclick = () => locEdit({ sec: b.dataset.add, group: '', name: '', cat: '', area: b.dataset.add === 'counter' ? st.areas[0] : 'Locker Area', sub: b.dataset.add === 'counter' ? st.subDisplays[0] : '', jtype: JTYPES[0], images: [], mode: 'both' }));
}
function admSettings() {
  const st = S.D.settings;
  $('#adm').innerHTML = `<div class="card">
    <label class="f">Shop name</label><input type="text" id="sN" value="${esc(st.shopName)}">
    <label class="f">Admin WhatsApp number for reports (with country code, e.g. 9187141 22750)</label><input type="tel" id="sW" value="${esc(st.waNumber)}" placeholder="91XXXXXXXXXX">
    <label class="f">Box weight tolerance (± grams)</label><input type="number" step="0.001" id="sT" value="${st.wtTol}">
    <label class="chk" style="margin-top:10px"><input type="checkbox" id="sPh" ${st.reqPhotos ? 'checked' : ''}> Require item photos — one photo per piece before a tray can be submitted</label>
    <label class="chk"><input type="checkbox" id="sB" ${st.blind ? 'checked' : ''}> Blind count — staff don't see expected numbers while counting</label>
    <label class="f">Match app count against ERP</label><select id="sE"><option value="lbl" ${st.erpBasis !== 'pcs' ? 'selected' : ''}>Labels (Lbl)</option><option value="pcs" ${st.erpBasis === 'pcs' ? 'selected' : ''}>Pieces (Pc)</option></select>
    <label class="f">App item type → ERP ornament (one per line, e.g. Ring = G-Ring)</label><textarea id="sM" style="min-height:150px">${esc(Object.entries(st.erpItemMap || {}).map(([a, b]) => `${a} = ${b}`).join('\n'))}</textarea>
    <label class="f">Category → ERP ornament (overrides item type; use - for "not in this ERP report")</label><textarea id="sCM">${esc(Object.entries(st.erpCatMap || {}).map(([a, b]) => `${a} = ${b}`).join('\n'))}</textarea>
    <label class="f">Main locations (comma separated)</label><input type="text" id="sAr" value="${esc(st.areas.join(', '))}">
    <label class="f">Sub displays</label><input type="text" id="sSd" value="${esc(st.subDisplays.join(', '))}">
    <label class="f">ERP ornament for Platinum</label><input type="text" id="sPt" value="${esc(st.erpPlatinum || 'YFJ - PLATINUM MM')}">
    <label class="f">Discrepancy reasons (comma separated)</label><textarea id="sR">${esc(st.reasons.join(', '))}</textarea>
    <label class="f">Item types (comma separated)</label><textarea id="sI">${esc(st.itemTypes.join(', '))}</textarea>
    <label class="f">Purities</label><input type="text" id="sP" value="${esc(st.purities.join(', '))}">
    <label class="f">Categories</label><input type="text" id="sC" value="${esc(st.categories.join(', '))}">
    <button class="btn" style="width:100%;margin-top:14px" id="sS">Save settings</button></div>`;
  const list = (v) => v.split(',').map((x) => x.trim()).filter(Boolean);
  const kv = (v) => Object.fromEntries(v.split('\n').map((x) => x.split('=').map((y) => y.trim())).filter((x) => x[0] && x.length > 1));
  $('#sS').onclick = async () => { try { await api('settings', { settings: { shopName: $('#sN').value, waNumber: $('#sW').value, wtTol: +$('#sT').value, blind: $('#sB').checked, reqPhotos: $('#sPh').checked, erpBasis: $('#sE').value, areas: list($('#sAr').value), subDisplays: list($('#sSd').value), erpPlatinum: $('#sPt').value, erpItemMap: kv($('#sM').value), erpCatMap: kv($('#sCM').value), reasons: list($('#sR').value), itemTypes: list($('#sI').value), purities: list($('#sP').value), categories: list($('#sC').value) } }); toast('Settings saved'); load(true); } catch (e) { fail(e); } };
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
