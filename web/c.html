<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Collection</title>
<script src="brand.js"></script>
<style>
/* V1.9.32 customer collection page: opened from a temporary link, no login */
:root{--maroon:#702438;--band:#491525;--gold:#C99583;--bg:#FAF7F3;--surface:#fff;--sunk:#F2E4DB;--fg:#1D1D1F;--muted:#795B4D;--line:#EADCD2;--wa:#1F8A4C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit}
.top{background:linear-gradient(180deg,var(--band),var(--maroon));color:#fff;padding:22px 18px 26px;text-align:center}
.top img{height:54px;max-width:70%;object-fit:contain;filter:brightness(0) invert(1);opacity:.96}
.top h1{margin:12px 0 4px;font:600 clamp(22px,5vw,32px)/1.2 Georgia,"Times New Roman",serif;letter-spacing:.01em}
.top p{margin:0;opacity:.86;font-size:14px}
.top .note{margin:10px auto 0;max-width:640px;font-size:15px;opacity:.95;white-space:pre-line}
.wrap{max-width:1280px;margin:0 auto;padding:16px 14px 110px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--maroon);border-color:var(--maroon);color:#fff}
.chip small{opacity:.7;margin-left:4px}
.count{color:var(--muted);font-size:13px;margin:0 2px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
@media (max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:10px}}
.card{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--surface);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;padding:0;color:inherit;box-shadow:0 2px 10px rgba(73,21,37,.06);transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:0 8px 24px rgba(73,21,37,.12);transform:translateY(-1px)}
.ph{aspect-ratio:1/1;background:var(--sunk);display:grid;place-items:center;overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .none{color:var(--muted);font-size:13px}
.ph .np{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;font-size:11.5px;padding:2px 8px}
.ci{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.ci b{font-size:15px;font-weight:600;line-height:1.3}
.ci small{color:var(--muted);font-size:12.5px}
.pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:4px}
.pr .now{font-weight:700;font-size:16px;color:var(--maroon);font-variant-numeric:tabular-nums}
.pr s{color:var(--muted);font-size:13px}
.pr .sv{color:var(--wa);font-size:12px;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.foot{text-align:center;color:var(--muted);font-size:12.5px;padding:24px 16px 10px;line-height:1.6}
.fab{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--wa);color:#fff;border:0;border-radius:999px;padding:14px 22px;font-weight:600;font-size:15px;box-shadow:0 10px 28px rgba(0,0,0,.22);text-decoration:none;z-index:5;white-space:nowrap}
.fab svg{width:22px;height:22px}
/* detail */
.dlg{position:fixed;inset:0;background:rgba(20,8,10,.6);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.dlg[hidden]{display:none}
.sheet{background:var(--surface);width:min(760px,100%);max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding-bottom:calc(84px + env(safe-area-inset-bottom));position:relative}
@media (min-width:800px){.dlg{align-items:center}.sheet{border-radius:20px;max-height:90vh}}
.x{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:22px;cursor:pointer;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.car{position:relative;background:var(--sunk);aspect-ratio:1/1;max-height:62vh;width:100%;overflow:hidden}
.car img{width:100%;height:100%;object-fit:contain;display:block;background:var(--sunk)}
.car .nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:22px;cursor:pointer}
.car .pv{left:10px}.car .nx{right:10px}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.18)}
.dots i.on{background:var(--maroon)}
.dt{padding:16px 18px}
.dt h2{margin:0 0 2px;font:600 22px/1.25 Georgia,serif}
.dt .cat{color:var(--muted);font-size:14px}
.dt .pr .now{font-size:22px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:14px 0 0;font-size:14.5px}
.dl dt{color:var(--muted)}.dl dd{margin:0}
.ask{position:absolute;left:18px;right:18px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:center;gap:10px;background:var(--wa);color:#fff;border-radius:14px;padding:14px;font-weight:600;text-decoration:none}
.sheet .ask{position:sticky;margin:6px 18px 0;bottom:calc(14px + env(safe-area-inset-bottom))}
.msg{max-width:520px;margin:80px auto;text-align:center;padding:24px}
.msg h2{font:600 24px Georgia,serif;margin:0 0 8px}
.msg p{color:var(--muted)}
</style>
</head>
<body>
<header class="top" id="top"><img id="logo" alt=""><h1 id="ttl">Loading…</h1><p id="sub"></p><p class="note" id="note" hidden></p></header>
<main class="wrap" id="main">
  <div class="chips" id="chips" role="toolbar" aria-label="Filter by type"></div>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
  <p class="foot" id="foot"></p>
</main>
<a class="fab" id="fab" hidden target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.6 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.1-1.9-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5.1-4.5-.1-.2-1.2-1.6-1.2-3.1s.8-2.2 1-2.5c.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.2 1.4 2.5 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.1.1.7-.2 1.4Z"/></svg><span>Ask on WhatsApp</span></a>
<div class="dlg" id="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="dName"><div class="sheet" id="sheet"></div></div>
<script>
(function(){
const B=window.BRAND||{};const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
try{const L=B.light||{};for(const [k,v] of Object.entries(L))if(/^--(maroon|band|gold|bg|surface|sunk|fg|muted|line)$/.test(k))document.documentElement.style.setProperty(k,v)}catch(e){}
const logo=B.labelLogo||B.logoHeaderColor||B.logoHeader||'';if(logo)$('logo').src=logo;else $('logo').remove();
const id=(window.COL_ID||new URLSearchParams(location.search).get('id')||(location.pathname.match(/\/c\/([A-Za-z0-9]+)/)||[])[1]||location.hash.slice(1)||'').replace(/[^A-Za-z0-9]/g,'');
const api=(op,extra)=>'/api/sync?op='+op+'&id='+encodeURIComponent(id)+(extra||'');
const img=(k,i)=>api('colimg','&k='+encodeURIComponent(k)+'&i='+i);
let C=null,cat='',cur=null,ci=1;
function wa(text){let n=String(C&&C.wa||'').replace(/\D/g,'');if(n.length===10)n='91'+n;return 'https://wa.me/'+n+'?text='+encodeURIComponent(text)}
function fail(t,p){document.title=t;$('top').innerHTML=(logo?`<img src="${esc(logo)}" alt="" style="height:54px;filter:brightness(0) invert(1)">`:'')+`<h1>${esc(t)}</h1>`;$('main').innerHTML=`<div class="msg"><h2>${esc(t)}</h2><p>${esc(p)}</p>${B.addr2?`<p>${esc((B.addr2||[]).join(' · '))}</p>`:''}</div>`}
function price(x,big){if(!x.p&&!x.f)return '';const now=x.f&&x.f>0?x.f:x.p;const was=x.f&&x.p>x.f?x.p:0;return `<div class="pr"><span class="now">${inr(now)}</span>${was?`<s>${inr(was)}</s><span class="sv">Save ${inr(was-now)}</span>`:''}</div>`}
function paint(){
  const cats=[...new Map(C.items.map(x=>[x.c||'Other',0])).keys()];const cnt=c=>C.items.filter(x=>(x.c||'Other')===c).length;
  $('chips').innerHTML=cats.length>1?[['','All',C.items.length],...cats.map(c=>[c,c,cnt(c)])].map(([v,l,n])=>`<button type="button" class="chip" data-c="${esc(v)}" aria-pressed="${cat===v}">${esc(l)}<small>${n}</small></button>`).join(''):'';
  $('chips').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cat=b.dataset.c;paint()});
  const L=C.items.filter(x=>!cat||(x.c||'Other')===cat);
  $('count').textContent=`${L.length} design${L.length===1?'':'s'}`;
  $('grid').innerHTML=L.length?L.map(x=>`<button type="button" class="card" data-k="${esc(x.k)}"><div class="ph">${x.n?`<img loading="lazy" src="${img(x.k,1)}" alt="${esc(x.t)}">${x.n>1?`<span class="np">${x.n} photos</span>`:''}`:'<span class="none">Photo coming soon</span>'}</div><div class="ci"><b>${esc(x.t)}</b><small>${esc([x.c,x.k].filter(Boolean).join(' · '))}</small>${price(x)}</div></button>`).join(''):'<p class="empty">Nothing here.</p>';
  $('grid').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>open(C.items.find(x=>x.k===b.dataset.k)));
}
function open(x){cur=x;ci=1;
  const n=Math.max(1,x.n||0);
  $('sheet').innerHTML=`<button type="button" class="x" id="dX" aria-label="Close">×</button>
    <div class="car">${x.n?`<img id="dImg" src="${img(x.k,1)}" alt="${esc(x.t)}">`:'<div style="display:grid;place-items:center;height:100%;color:var(--muted)">Photo coming soon</div>'}${x.n>1?`<button type="button" class="nav pv" id="dPv" aria-label="Previous photo">‹</button><button type="button" class="nav nx" id="dNx" aria-label="Next photo">›</button><div class="dots" id="dDots">${Array.from({length:n},(_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`:''}</div>
    <div class="dt"><h2 id="dName">${esc(x.t)}</h2><div class="cat">${esc([x.c,x.k].filter(Boolean).join(' · '))}</div>${price(x,1)}
    ${x.l&&x.l.length?`<dl class="dl">${x.l.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl>`:''}</div>
    ${C.wa?`<a class="ask" target="_blank" rel="noopener" href="${wa(`Hi ${C.shop||''}, I'm interested in ${x.t} (${x.k}) from “${C.title}”.`)}">Ask about this design on WhatsApp</a>`:''}`;
  $('dlg').hidden=false;document.body.style.overflow='hidden';
  $('dX').onclick=close;
  const go=d=>{ci=((ci-1+d+n)%n)+1;$('dImg').src=img(x.k,ci);[...$('dDots').children].forEach((e,i)=>e.classList.toggle('on',i===ci-1))};
  if($('dPv')){$('dPv').onclick=()=>go(-1);$('dNx').onclick=()=>go(1);let sx=0;const c=$('sheet').querySelector('.car');c.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});c.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>40)go(d<0?1:-1)})}
}
function close(){$('dlg').hidden=true;document.body.style.overflow='';cur=null}
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&cur)close()});
if(!id){fail('Link not complete','Please open the full link that was sent to you.');return}
fetch(api('col'),{cache:'no-store'}).then(async r=>{const j=await r.json().catch(()=>({}));
  if(r.status===410){fail('This link has expired','Ask us for a new link — we will be happy to share our latest designs.');return}
  if(!r.ok||!j.items){fail('Link not found','This collection link is not available. Ask us for a new link.');return}
  C=j;document.title=`${C.title} · ${B.full||B.name||''}`;
  $('ttl').textContent=C.title;$('sub').textContent=`${C.shop||B.full||''}${C.exp?` · link valid till ${new Date(C.exp).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}`:''}`;
  if(C.note){$('note').textContent=C.note;$('note').hidden=false}
  $('foot').innerHTML=esc((B.addr2||[]).join(' · '))+((C.items||[]).some(x=>x.p||x.f)?'<br>Prices as on the day this link was made; the final price is confirmed at billing.':'<br>Message us for prices.');
  if(C.wa){$('fab').href=wa(`Hi ${C.shop||''}, I saw your collection “${C.title}”.`);$('fab').hidden=false}
  paint();
}).catch(()=>fail('Could not load','Check your internet and open the link again.'));
})();
</script>
</body>
</html>
