plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.marunnukazhicho.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.marunnukazhicho.app'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    // Fixed key so each new APK installs over the previous one (medicines are kept)
    signingConfigs {
        sideload {
            storeFile file('mk-sideload.keystore')
            storePassword 'marunnu123'
            keyAlias 'mk'
            keyPassword 'marunnu123'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
        debug {
            signingConfig signingConfigs.sideload
        }
    }

    // The screens live in ../../web
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../../web']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
}
