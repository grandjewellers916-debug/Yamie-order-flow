name: Build Stock Check APK

on:
  push:
    branches: [stock-check]
    paths: ['android/**', '.github/workflows/stock-check-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        run: |
          for u in https://github.com/gradle/gradle-distributions/releases/download/v8.7.0/gradle-8.7-bin.zip https://downloads.gradle.org/distributions/gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip; do
            for i in 1 2 3; do curl -fsSL -o /tmp/gradle.zip "$u" && break 2; sleep 10; done
          done
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk yamie-stock-check.apk

      - uses: actions/upload-artifact@v4
        with:
          name: yamie-stock-check-apk
          path: yamie-stock-check.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stock-check-apk-v${{ github.run_number }}
          name: Yamie Stock Check APK v1.5.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: yamie-stock-check.apk
          body: "Install on shop phones (allow install from this source). Opens https://yamie-stock-check.netlify.app — web updates arrive without a new APK. Each new APK installs over the previous one."
