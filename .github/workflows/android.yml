name: Build Android app

on:
  push:
    branches: [price-check]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Stamp version
        run: sed -i "s/1.0.__BUILD__/1.0.${{ github.run_number }}/" web/index.html

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Name the APKs
        run: |
          cp android/app/build/outputs/apk/yamie/release/app-yamie-release.apk yamie-price-check.apk
          cp android/app/build/outputs/apk/grand/release/app-grand-release.apk grand-price-check.apk

      - uses: actions/upload-artifact@v4
        with:
          name: price-check-apks
          path: |
            yamie-price-check.apk
            grand-price-check.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: price-check-v${{ github.run_number }}
          name: Price Check v1.0.${{ github.run_number }} (Yamie + Grand)
          target_commitish: ${{ github.sha }}
          files: |
            yamie-price-check.apk
            grand-price-check.apk
          body: "Yamie shop phones: yamie-price-check.apk. Grand Jewellers phones: grand-price-check.apk. Each updates over its previous version; both can sit on one phone."
