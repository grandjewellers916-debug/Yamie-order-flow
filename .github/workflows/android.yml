name: Build Order Desk APK

on:
  push:
    branches: [order-desk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        run: |
          for u in https://github.com/gradle/gradle-distributions/releases/download/v8.7.0/gradle-8.7-bin.zip https://downloads.gradle.org/distributions/gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip; do
            for i in 1 2 3; do curl -fsSL -o /tmp/gradle.zip "$u" && break 2; sleep 10; done
          done
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Name the APK
        run: |
          V=$(grep -o 'versionName "[0-9.]*"' android/app/build.gradle | grep -o '[0-9][0-9.]*')
          cp android/app/build/outputs/apk/release/app-release.apk "Yamie-Order-Desk-v${V}${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: yamie-order-desk-apk
          path: Yamie-Order-Desk-v*.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: order-desk-v${{ github.run_number }}
          name: Yamie Order Desk v2.4.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: Yamie-Order-Desk-v*.apk
          body: "Yamie Order Desk V2.4: Grand orders work flow - receive the vendor delivery item by item against the order (weight discrepancy, not received items), incomplete orders stay open with pending items, QC pass or fail, laser marking, labelling, box with a printed report showing the staff who did each step, sent to Grand, then the order closes. Staff lists for each step in Grand lists. Includes everything in V2.3. Installs over the old version."
