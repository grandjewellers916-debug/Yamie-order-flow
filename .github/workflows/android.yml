name: Build Android app

on:
  push:
    branches: [price-check]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk yamie-price-check.apk

      - uses: actions/upload-artifact@v4
        with:
          name: yamie-price-check-apk
          path: yamie-price-check.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: price-check-v${{ github.run_number }}
          name: Yamie Price Check v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: yamie-price-check.apk
          body: Install yamie-price-check.apk on the phone. It updates over the previous version.
