name: Build Marunnu Kazhicho APK

on:
  push:
    branches: [marunnu-kazhicho]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk marunnu-kazhicho.apk
      - uses: actions/upload-artifact@v4
        with:
          name: marunnu-kazhicho-apk
          path: marunnu-kazhicho.apk
      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: marunnu-kazhicho-v${{ github.run_number }}
          name: Marunnu Kazhicho? v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: marunnu-kazhicho.apk
          body: "Medicine reminder app. Install marunnu-kazhicho.apk on the phone; new versions install over the old one and keep all medicines."
