name: Build Repair Desk APK

on:
  push:
    branches: [repair-track]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        run: |
          for u in https://github.com/gradle/gradle-distributions/releases/download/v8.7.0/gradle-8.7-bin.zip https://downloads.gradle.org/distributions/gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip; do
            for i in 1 2 3; do curl -fsSL -o /tmp/gradle.zip "$u" && break 2; sleep 10; done
          done
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk yamie-repair-desk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: yamie-repair-desk-apk
          path: yamie-repair-desk.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: repair-track-v${{ github.run_number }}
          name: Yamie Repair Desk v1.2.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: yamie-repair-desk.apk
          body: "Yamie Repair Desk V1.2: call smith from the app with call outcome log, direct calling; V1.1: new app logo, auto message after QC, picture card or plain text WhatsApp, 7-day delay warning, check with smith, inform customer of delay (permission). Install yamie-repair-desk.apk on the shop phone. New versions install over the old one and keep all repair jobs, users and settings."
