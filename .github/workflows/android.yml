name: Build Repair Desk APK

on:
  push:
    branches: [repair-track]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        run: |
          for u in https://github.com/gradle/gradle-distributions/releases/download/v8.7.0/gradle-8.7-bin.zip https://downloads.gradle.org/distributions/gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip; do
            for i in 1 2 3; do curl -fsSL -o /tmp/gradle.zip "$u" && break 2; sleep 10; done
          done
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Name the APK
        run: |
          V=$(grep -o 'versionName "[0-9.]*"' android/app/build.gradle | grep -o '[0-9][0-9.]*')
          cp android/app/build/outputs/apk/release/app-release.apk "Yamie-Repair-Desk-v${V}${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: yamie-repair-desk-apk
          path: Yamie-Repair-Desk-v*.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: repair-track-v${{ github.run_number }}
          name: Yamie Repair Desk v1.7.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: Yamie-Repair-Desk-v*.apk
          body: "Yamie Repair Desk V1.8: full backup & restore (one zip with every repair, photo, user and setting); V1.7: admin job reset and clear all repairs; V1.6: assigned smith per service, suggested at issue, issue to next smith; V1.5: admin can add services and set minimum charges; V1.4: computer layout for the web version; V1.3: one shared database for all phones and users (yamie-repair-desk.netlify.app); V1.2: call smith from the app with call outcome log, direct calling; V1.1: new app logo, auto message after QC, picture card or plain text WhatsApp, 7-day delay warning, check with smith, inform customer of delay (permission). Install yamie-repair-desk.apk on the shop phone. New versions install over the old one and keep all repair jobs, users and settings."
