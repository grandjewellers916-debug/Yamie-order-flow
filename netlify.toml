[build]
  publish = "web"
  functions = "netlify/functions"
  command = "sed -i \"s/__BUILD__/web-${COMMIT_REF:0:7}/\" web/index.html"

# ADMIN_PIN and KIOSK_RATES_PIN are short PINs; ADMIN_PIN is only the first-login starting PIN (changed after setup); a 4-digit value also matches digits inside bundled libraries
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_PIN,KIOSK_RATES_PIN"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
